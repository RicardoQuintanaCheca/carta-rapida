<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mis cartas · Carta Rápida</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<link rel="stylesheet" href="/cuenta.css">
<style>
  :root { color-scheme: light; --ink: #0C0C0D; --cta: #FF4A1C; --coral: #FF4A1C; --crema: #FFFFFF; --linea: #E6E6EA; --gris: #6C6C72; --tinta-coral: #C93A0E; --suave: #F3F3F5; --f: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #fff; color: var(--ink); font-family: var(--f); font-size: 15.5px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--tinta-coral); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--cta); outline-offset: 2px; border-radius: 6px; }

  /* Barra superior: la misma de la portada */
  .barra { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.9); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--linea); }
  .barra-in { max-width: 1320px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; gap: 14px; }
  .logo { text-decoration: none; color: var(--ink); font-weight: 800; font-size: 19px; letter-spacing: -.03em; white-space: nowrap; }
  .logo span { color: var(--cta); }
  .barra-esp { flex: 1; }
  .plan-pill { font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 8px; background: var(--suave); color: var(--gris); white-space: nowrap; }
  .plan-pill.pro { background: #EAF3EC; color: #1F5E33; }
  .plan-pill.prueba { background: #FDF1EA; color: var(--tinta-coral); }
  .btn-pro-barra { border: none; background: var(--cta); color: #fff; font-weight: 700; font-size: 14px; padding: 0 16px; min-height: 40px; border-radius: 10px; cursor: pointer; white-space: nowrap; transition: background-color .2s; }
  .btn-pro-barra:hover { background: var(--ink); }
  .menu-cuenta { position: relative; }
  .menu-cuenta > button { width: 40px; height: 40px; border-radius: 10px; border: none; background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; text-transform: uppercase; }
  .menu-lista { position: absolute; right: 0; top: 50px; background: #fff; border: 1px solid var(--linea); border-radius: 14px; box-shadow: 0 30px 60px -24px rgba(12,12,13,.35); padding: 8px; min-width: 260px; z-index: 60; }
  .menu-lista .menu-email { font-size: 13px; color: var(--gris); padding: 8px 10px 10px; border-bottom: 1px solid var(--linea); margin-bottom: 6px; word-break: break-all; }
  .menu-lista button, .menu-lista a { display: block; width: 100%; text-align: left; border: none; background: none; padding: 10px; border-radius: 8px; font-size: 14.5px; font-weight: 500; cursor: pointer; color: var(--ink); text-decoration: none; }
  .menu-lista button:hover, .menu-lista a:hover { background: var(--suave); }
  .menu-lista .peligro { color: #B3261E; }

  .envoltura { max-width: 1320px; margin: 0 auto; padding: 40px 24px 96px; }

  /* Acceso sin sesión */
  .bienvenida { max-width: 620px; margin: 56px auto; text-align: left; }
  .bienvenida h1 { font-size: clamp(36px, 6vw, 60px); line-height: 1; letter-spacing: -.045em; font-weight: 750; margin: 0 0 18px; text-wrap: balance; }
  .bienvenida p { color: var(--gris); font-size: 18px; line-height: 1.55; margin: 0 0 28px; }
  .fila-botones { display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; color: var(--ink); border-radius: 10px; padding: 0 20px; min-height: 48px; font-weight: 650; font-size: 15.5px; cursor: pointer; text-decoration: none; transition: box-shadow .2s, background-color .2s, color .2s; }
  .btn:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn.primario { background: var(--cta); color: #fff; box-shadow: none; }
  .btn.primario:hover { background: var(--ink); }
  .btn.oscuro { background: var(--ink); color: #fff; box-shadow: none; }
  .btn.oscuro:hover { background: var(--cta); }
  .btn.peq { padding: 0 14px; min-height: 38px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* Lista de cartas */
  .cab-lista { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--linea); }
  .cab-lista h1 { font-size: clamp(34px, 4.4vw, 54px); letter-spacing: -.045em; font-weight: 750; margin: 0; line-height: 1; }
  .cab-lista p { margin: 10px 0 0; color: var(--gris); font-size: 16px; }
  .aviso-plan { display: flex; align-items: center; gap: 16px; justify-content: space-between; flex-wrap: wrap; border-radius: 16px; padding: 20px 22px; background: var(--suave); margin-bottom: 28px; }
  .aviso-plan.prueba { background: #FDF1EA; }
  .aviso-plan.caducado { background: #FBECE9; }
  .aviso-plan b { font-size: 19px; letter-spacing: -.02em; display: block; margin-bottom: 3px; }
  .aviso-plan span { color: var(--gris); font-size: 14.5px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  /* Cada carta guardada: la hoja sobre la mesa */
  .tarjeta { display: flex; flex-direction: column; }
  .tarjeta-img { aspect-ratio: 210 / 235; background-color: var(--suave); background-position: center 18px; background-size: 78% auto; background-repeat: no-repeat; border-radius: 14px; cursor: pointer; transition: background-color .2s, background-position .35s cubic-bezier(.2,.8,.2,1); }
  .tarjeta:hover .tarjeta-img { background-color: #EFEAE2; }
  .tarjeta-img { position: relative; overflow: hidden; }
  .tarjeta-img iframe { position: absolute; top: 18px; border: 0; pointer-events: none; transform-origin: top left; opacity: 0; transition: opacity .35s ease, translate .35s cubic-bezier(.2,.8,.2,1); }
  .tarjeta-img.lista iframe { opacity: 1; }
  .tarjeta:hover .tarjeta-img iframe { translate: 0 -8px; }
  .tarjeta-cuerpo { padding: 14px 2px 0; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .tarjeta-tit { font-weight: 700; font-size: 17px; letter-spacing: -.02em; line-height: 1.25; }
  .tarjeta-meta { font-size: 13.5px; color: var(--gris); }
  .tarjeta-acc { display: flex; gap: 6px; margin-top: 12px; }
  .tarjeta-acc .btn { flex: 1; }
  .icono-btn { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px; border: none; box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); padding: 0; }
  .icono-btn:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .icono-btn.rojo:hover { box-shadow: inset 0 0 0 1.5px #B3261E; color: #B3261E; }
  .vacio { text-align: left; padding: clamp(32px, 6vw, 72px); border-radius: 20px; background: var(--suave); }
  .vacio h2 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.04em; font-weight: 750; line-height: 1.05; margin: 0 0 12px; }
  .vacio p { color: var(--gris); margin: 0 0 24px; max-width: 34em; font-size: 16.5px; }
  .nueva-tarjeta { border: 1.5px dashed #D9D1C6; border-radius: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 4px; padding: 20px; min-height: 260px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 17px; letter-spacing: -.02em; background: transparent; transition: border-color .2s, background-color .2s; }
  .nueva-tarjeta:hover { border-color: var(--cta); background: #FDF4EF; }
  .nueva-tarjeta .mas { width: 44px; height: 44px; border-radius: 10px; background: var(--cta); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500; margin-bottom: auto; }
  .nueva-tarjeta small { font-weight: 500; font-size: 13.5px; letter-spacing: 0; color: var(--gris); }

  /* Editor: a la izquierda la hoja de trabajo, a la derecha la carta */
  .ed-barra { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--linea); }
  .volver { border: none; background: none; cursor: pointer; font-weight: 600; color: var(--gris); padding: 8px 0; }
  .volver:hover { color: var(--ink); }
  .ed-titulo { flex: 1; min-width: 200px; border: none; box-shadow: inset 0 0 0 1.5px transparent; background: transparent; font-weight: 750; font-size: 28px; letter-spacing: -.035em; padding: 6px 10px; border-radius: 10px; }
  .ed-titulo:hover, .ed-titulo:focus { box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; outline: none; }
  .ed-titulo:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .guardado { font-size: 13.5px; color: var(--gris); white-space: nowrap; }
  .guardado.error { color: #B3261E; }
  .ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 540px); gap: clamp(28px, 4vw, 56px); align-items: start; }
  .ed-form { min-width: 0; }
  .ed-vista { position: sticky; top: 88px; }
  .bloque { padding: 26px 0; border-bottom: 1px solid var(--linea); }
  .bloque:last-child { border-bottom: none; }
  .bloque-tit { font-size: 21px; letter-spacing: -.03em; font-weight: 750; color: var(--ink); margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .campo { width: 100%; padding: 11px 13px; border: none; box-shadow: inset 0 0 0 1.5px var(--linea); border-radius: 10px; background: #fff; outline: none; font-size: 15px; transition: box-shadow .15s; }
  .campo:hover { box-shadow: inset 0 0 0 1.5px #D5CCBF; }
  .campo:focus { box-shadow: inset 0 0 0 1.5px var(--ink), 0 0 0 4px rgba(12,12,13,.06); }
  .campo.grande { font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .etq { display: block; font-size: 13.5px; font-weight: 600; margin: 0 0 6px; color: var(--ink); }
  .grupo { margin-bottom: 12px; }
  .cab-nombre, .cab-logo { margin-top: 14px; }
  .segmento { display: inline-flex; background: var(--suave); border-radius: 10px; padding: 4px; gap: 2px; }
  .segmento button { border: none; background: transparent; padding: 8px 16px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--gris); cursor: pointer; }
  .segmento button.on { background: var(--ink); color: #fff; }
  .logo-fila { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .logo-img { height: 52px; max-width: 170px; object-fit: contain; border-radius: 8px; padding: 6px; background: var(--suave); }
  .subir-logo { position: relative; overflow: hidden; }
  .subir-logo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .estilos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .estilo-b { border: none; box-shadow: inset 0 0 0 1.5px var(--linea); border-radius: 10px; background: #fff; padding: 5px 5px 7px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; transition: box-shadow .15s; }
  .estilo-b:hover { box-shadow: inset 0 0 0 1.5px #CFC6BA; }
  .estilo-b span:first-child { display: block; aspect-ratio: 210 / 200; border-radius: 6px; background: #fff center top / 100% auto no-repeat; }
  .estilo-b span:last-child { font-size: 12.5px; font-weight: 650; text-align: center; }
  .estilo-b.on { box-shadow: inset 0 0 0 2px var(--ink); }
  .seccion { border-radius: 14px; padding: 16px; margin-bottom: 12px; background: var(--suave); }
  .seccion-cab { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .seccion-cab .campo { flex: 1; font-weight: 700; }
  .plato { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 6px 8px; padding: 12px 0; border-top: 1px solid #E4DDD2; }
  .plato:first-of-type { border-top: none; }
  .plato .desc { grid-column: 1 / 3; }
  .plato .mas-datos { grid-column: 1 / 3; display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
  .plato .acciones { grid-row: 1 / span 3; grid-column: 3; display: flex; flex-direction: column; gap: 4px; }
  .plato .campo { padding: 9px 11px; font-size: 14.5px; }
  .plato .campo.nombre { font-weight: 650; }
  .plato .precio { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .destacado { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--gris); white-space: nowrap; cursor: pointer; padding: 0 4px; }
  .destacado input { accent-color: var(--cta); width: 16px; height: 16px; }
  .mini-btn { width: 32px; height: 32px; border-radius: 8px; border: none; box-shadow: inset 0 0 0 1.5px #DDD5C9; background: #fff; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; color: var(--gris); }
  .mini-btn:hover { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
  .mini-btn.rojo:hover { box-shadow: inset 0 0 0 1.5px #B3261E; color: #B3261E; }
  .anadir { border: 1.5px dashed #D2C9BC; background: transparent; border-radius: 10px; padding: 10px 12px; width: 100%; cursor: pointer; font-weight: 600; color: var(--gris); margin-top: 8px; transition: border-color .2s, color .2s; }
  .anadir:hover { border-color: var(--cta); color: var(--tinta-coral); }
  .anadir.seccion-nueva { padding: 15px; font-size: 15.5px; border-radius: 14px; }
  .servicio { display: grid; grid-template-columns: 1fr 96px 32px; gap: 6px; margin-bottom: 6px; }
  .frase { display: flex; gap: 8px; }
  .frase textarea { flex: 1; resize: vertical; min-height: 46px; }
  .ayuda { font-size: 13.5px; color: var(--gris); margin: 8px 0 0; line-height: 1.5; }
  fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
  fieldset:disabled .campo, fieldset:disabled button { opacity: .5; cursor: not-allowed; }

  .vista-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .vista-info { font-size: 13.5px; color: var(--gris); flex: 1; }
  .vista-marco { position: relative; background: var(--suave); border-radius: 18px; padding: 22px; overflow: hidden; max-height: calc(100vh - 230px); overflow-y: auto; overscroll-behavior: contain; }
  .vista-escala { margin: 0 auto; position: relative; }
  .vista-escala iframe { border: 0; transform-origin: top left; display: block; background: transparent; }
  .vista-cargando { position: absolute; top: 12px; right: 14px; font-size: 12.5px; font-weight: 600; background: var(--ink); color: #fff; padding: 6px 10px; border-radius: 8px; display: none; }
  .vista-marco.cargando .vista-cargando { display: block; }
  .descargar { width: 100%; margin-top: 12px; min-height: 54px; font-size: 16.5px; }
  .acc-pdf { display: flex; gap: 10px; }
  .campo.dos { font-style: italic; background: #FBFAF7; font-size: 14.5px; }
  .seccion-cab .campo.dos { flex: 1 1 100%; order: 5; }
  .dos-fila { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px; }
  .bi-fila { display: flex; gap: 10px; flex-wrap: wrap; }
  .bi-fila select { flex: 1 1 180px; }
  @media (max-width: 560px) { .dos-fila { grid-template-columns: minmax(0, 1fr); } }
  .colores { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .color-b { border: none; background: #fff; box-shadow: inset 0 0 0 1.5px var(--linea); border-radius: 99px; padding: 5px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ink); position: relative; }
  .color-b span { display: block; width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .color-b.estilo, .color-b.otro { padding-right: 14px; }
  .color-b.estilo span { background: linear-gradient(135deg, #fff 46%, #C9C4BC 46% 54%, #fff 54%); }
  .color-b.on { box-shadow: inset 0 0 0 2.5px var(--ink); }
  .color-b.otro input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
  .rs-elige { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
  .rs-formatos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .rs-formatos button { border: none; box-shadow: inset 0 0 0 1.5px var(--linea); border-radius: 14px; background: #fff; padding: 14px 12px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font: inherit; color: inherit; }
  .rs-formatos button.on { box-shadow: inset 0 0 0 2px var(--ink); background: var(--suave); }
  .rs-formatos i { display: block; height: 54px; border: 1.6px solid var(--ink); border-radius: 4px; background: #fff; margin-bottom: 8px; }
  .rs-formatos b { font-size: 15px; letter-spacing: -.015em; }
  .rs-formatos span { font-size: 12.5px; color: var(--gris); line-height: 1.35; }
  .rs-res { margin-top: 18px; transition: opacity .2s; }
  .rs-res.cargando { opacity: .45; }
  .rs-imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; align-items: start; }
  .rs-imgs.rs-historia { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .rs-imgs figure { margin: 0; }
  .rs-imgs img { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: 0 0 0 1px var(--linea), 0 14px 30px -18px rgba(12,12,13,.4); background: #fff; }
  .rs-imgs figcaption { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  @media (max-width: 560px) { .rs-elige { grid-template-columns: minmax(0, 1fr); } .rs-formatos span { display: none; } }
  .imp-velo { position: fixed; inset: 0; z-index: 800; background: rgba(12,12,13,.55); display: grid; place-items: center; padding: 20px; animation: impVelo .16s ease-out; }
  .imp-caja { width: min(100%, 460px); background: #fff; border-radius: 20px; padding: 28px 28px 24px; box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: impCaja .2s ease-out; }
  .imp-sobre { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-coral); }
  .imp-caja h2 { font-size: 24px; letter-spacing: -.03em; line-height: 1.15; margin: 8px 0 12px; }
  .imp-caja p { margin: 0; font-size: 16.5px; line-height: 1.5; color: #3a3a3f; }
  .imp-bot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .imp-bot .btn { min-height: 48px; }
  @keyframes impVelo { from { opacity: 0; } }
  @keyframes impCaja { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { .imp-velo, .imp-caja { animation: none; } }
  .acc-pdf .js-descargar { flex: 1 1 auto; }
  .acc-pdf .js-imprimir { flex: 0 0 auto; width: auto; padding: 0 26px; }
  /* Imprimir desde el navegador del móvil falla demasiado: ahí solo se descarga */
  @media (max-width: 860px), (pointer: coarse) { .js-imprimir { display: none !important; } }
  .nota-vista { font-size: 13px; color: var(--gris); text-align: center; margin-top: 10px; }
  .pestanas { display: none; }


  /* Franja de Pro: lo que tienes, a un clic */
  .pro-franja { background: var(--ink); color: #fff; border-radius: 20px; padding: clamp(20px, 3vw, 30px); margin-bottom: 28px; }
  .pro-franja-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .pro-franja-cab b { font-size: clamp(21px, 2.4vw, 27px); letter-spacing: -.03em; font-weight: 750; display: flex; align-items: center; gap: 10px; }
  .pro-sello { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--cta); color: #fff; padding: 4px 8px; border-radius: 6px; }
  .pro-franja-cab span.sub { color: #B9B9C0; font-size: 14.5px; display: block; margin-top: 4px; font-weight: 500; letter-spacing: 0; }
  .pro-franja-cab button { border: none; background: none; color: #fff; font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 0; }
  .pro-accesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .pro-acceso { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #fff; background: #1B1B1E; border-radius: 14px; padding: 16px 18px; transition: background-color .2s, translate .2s; }
  .pro-acceso:hover { background: #26262B; translate: 0 -2px; }
  .pro-acceso strong { font-size: 16px; letter-spacing: -.015em; font-weight: 700; }

  /* Puente a Kartia: la carta, en su portamenús */
  .kartia { margin-top: 36px; border-radius: 20px; background: #F6F1EA; padding: clamp(22px, 3.4vw, 36px); display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 48px); align-items: center; }

  .ejemplos button { border: none; box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 550; cursor: pointer; color: var(--ink); }
  .ejemplos button:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }

  /* Alérgenos: una fila por plato, los 14 en columna */

  .al-cols, .al-celdas { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }

  .al-cols span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 8.6px; font-weight: 600; letter-spacing: -.02em; color: var(--gris); text-align: center; line-height: 1.15; white-space: nowrap; }

  .al-c { aspect-ratio: 1; max-height: 40px; width: 100%; border-radius: 9px; border: none; box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #C9C9CF; padding: 0; transition: background-color .12s, box-shadow .12s, color .12s; }

  /* Formato de la hoja */
  .formatos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .menu-campos { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 0 14px; }

  @media (max-width: 560px) { .menu-campos { grid-template-columns: minmax(0, 1fr); } }
  .formato-b { border: none; box-shadow: inset 0 0 0 1.5px var(--linea); border-radius: 14px; background: #fff; padding: 16px 14px 14px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; transition: box-shadow .15s, background-color .15s; }
  .formato-b:hover { box-shadow: inset 0 0 0 1.5px #CFC6BA; }

  .formato-b span { font-size: 13px; color: var(--gris); line-height: 1.4; }

  @media (max-width: 1000px) {

<body>

<header class="barra">
  <div class="barra-in">
    <a class="logo" href="/" aria-label="Carta Rápida, inicio">Carta <span>Rápida</span></a>
    <div class="barra-esp"></div>
    <span class="plan-pill" id="planPill" hidden></span>
    <button class="btn-pro-barra" id="btnProBarra" type="button" hidden onclick="Cuenta.planes({ vuelta: 'panel' })">Hazte Pro</button>
    <div class="menu-cuenta" id="menuCuenta" hidden>
      <button type="button" id="menuBoton" aria-haspopup="true" aria-expanded="false" aria-label="Tu cuenta"></button>
      <div class="menu-lista" id="menuLista" hidden>
        <div class="menu-email" id="menuEmail"></div>
        <a href="/panel">Mis cartas</a>
        <a href="/#herramienta">Crear carta desde una foto</a>
        <a href="/admin" id="menuAdmin" hidden>Administración</a>
        <button type="button" id="menuPortal" onclick="Cuenta.portal()">Plan, facturas y darse de baja</button>
        <button type="button" onclick="cambiarClave()">Contraseña</button>
        <button type="button" onclick="Cuenta.salir().then(() => location.href = '/panel')">Salir</button>
        <button type="button" class="peligro" onclick="borrarCuenta()">Borrar mi cuenta</button>
      </div>
    </div>
  </div>
</header>

<main class="envoltura" id="app">
  <div class="cargando-pag" role="status">Cargando…</div>
</main>

<script src="/cuenta.js"></script>
<script src="/carta/alergenos.js"></script>
<script>
  const ESTILOS = [['riviera','Riviera'],['azulejo','Azulejo'],['serigrafia','Serigrafía'],['cartel','Cartel'],['bloque','Bloque'],['marinero','Marinero'],['brunch','Brunch'],['vermut','Vermut'],['pizarra','Pizarra'],['ticket','Ticket'],['gaceta','Gaceta'],['trattoria','Trattoria'],['editorial','Editorial'],['sobremesa','Sobremesa'],['sumi','Sumi'],['brasserie','Brasserie'],['deco','Déco'],['mantel','Mantel'],['barra','Barra'],['autor','Autor']];
  const NOMBRE_ESTILO = Object.fromEntries(ESTILOS);
  const IDIOMAS = { en: 'inglés', fr: 'francés', de: 'alemán', it: 'italiano', pt: 'portugués', zh: 'chino' };
  const esc = Cuenta.esc;
  const app = document.getElementById('app');
  let ed = null; // estado del editor

  // Analítica: solo si ya aceptó las cookies en la web (aquí no se vuelve a preguntar)
  const _cola = []; let _gaLista = false;
  function medir(e, d) { try { if (_gaLista) gtag('event', e, d || {}); else _cola.push([e, d]); } catch (err) {} }
  (function () {
    let el = null; try { el = JSON.parse(localStorage.getItem('cr_consentimiento')); } catch (e) {}
    if (!el || !el.si || Date.now() - el.t > 365 * 864e5) return;
    fetch('/config').then(r => r.json()).then(c => {
      if (!c.ga4) return;
      window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); };
      gtag('consent', 'default', { ad_storage: 'granted', analytics_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'denied' });
      gtag('js', new Date()); gtag('config', c.ga4, { anonymize_ip: true });
      _gaLista = true; _cola.splice(0).forEach(([e, d]) => gtag('event', e, d || {}));
      const sc = document.createElement('script'); sc.async = true; sc.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(c.ga4); document.head.appendChild(sc);
    }).catch(() => {});
  })();

  // ── Barra ──
  function pintarBarra() {
    const c = Cuenta.estado;
    document.getElementById('menuCuenta').hidden = !c;
    const pill = document.getElementById('planPill');
    const pro = document.getElementById('btnProBarra');
    if (!c) { pill.hidden = true; pro.hidden = true; return; }
    document.getElementById('menuBoton').textContent = c.email.charAt(0);
    document.getElementById('menuEmail').textContent = c.email;
    document.getElementById('menuPortal').hidden = !c.puedePortal;
    document.getElementById('menuAdmin').hidden = !c.admin;
    pill.hidden = false;
    pill.className = 'plan-pill ' + c.plan;
    pill.textContent = Cuenta.textoPlan();
    pro.hidden = c.plan === 'pro';
  }
  const menuBoton = document.getElementById('menuBoton');
  menuBoton.onclick = (e) => {
    e.stopPropagation();
    const l = document.getElementById('menuLista');
    l.hidden = !l.hidden;
    menuBoton.setAttribute('aria-expanded', String(!l.hidden));
  };
  document.addEventListener('click', () => { document.getElementById('menuLista').hidden = true; });
  window.addEventListener('cuenta', () => { pintarBarra(); if (!ed) route(); else pintarBloqueo(); });

  // ── Rutas: /panel y /panel#carta=ID ──
  function route() {
    if (!Cuenta.estado) return pintarBienvenida();
    const m = location.hash.match(/^#carta=([\w-]+)/);
    if (m) return abrirEditor(m[1]);
    // Llegada desde la portada: «Hacer el menú del día» crea el menú y lo abre
    if (/^#menu=nuevo/.test(location.hash)) { history.replaceState(null, '', location.pathname); return pintarLista().then(c => nuevoMenu(c || [])); }
    pintarLista();
  }
  window.addEventListener('hashchange', () => { if (ed && ed.pendiente) guardarYa(); ed = null; route(); });

  function pintarBienvenida() {
    ed = null;
    app.innerHTML = `<div class="bienvenida">
      <h1>Tus cartas, siempre a mano.</h1>
      <p>Guarda tus cartas y cámbialas cuando cambien los precios o la temporada: platos, precios, estilo y logo. Descarga el PDF al momento.</p>
      <div class="fila-botones">
        <button class="btn primario" type="button" onclick="Cuenta.acceso({ modo: 'crear', alEntrar: route })">Crear cuenta · 7 días gratis</button>
        <button class="btn" type="button" onclick="Cuenta.acceso({ modo: 'entrar', alEntrar: route })">Entrar</button>
      </div>
      <p style="margin-top:28px;font-size:14px">¿Aún no tienes tu carta? <a href="/#herramienta">Hazla gratis en 30 segundos →</a></p>
    </div>`;
  }

  function haceCuanto(ms) {
    const s = (Date.now() - ms) / 1000;
    if (s < 60) return 'hace un momento';
    if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';
    return new Date(ms).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  }

  function avisoPlanHTML() {
    const c = Cuenta.estado;
    if (c.plan === 'pro') return '';
    if (c.plan === 'prueba') {
      const dias = Math.max(1, Math.ceil((c.hasta - Date.now()) / 864e5));
      return `<div class="aviso-plan prueba"><div><b>Tu prueba de Pro: ${dias === 1 ? 'queda 1 día' : 'quedan ' + dias + ' días'}</b><span>Hazte Pro para seguir editando tus cartas cuando termine. Desde 9,90 € al mes.</span></div>
        <button class="btn primario" type="button" onclick="Cuenta.planes({ vuelta: 'panel' })">Hazte Pro</button></div>`;
    }
    return `<div class="aviso-plan caducado"><div><b>${c.habiaPro ? 'Tu Carta Pro ha terminado' : 'Tu prueba de Pro ha terminado'}</b><span>Tus cartas siguen aquí. Actívala para editarlas, cambiar precios y descargarlas sin firma.</span></div>
      <button class="btn primario" type="button" onclick="Cuenta.planes({ vuelta: 'panel' })">Activar Pro</button></div>`;
  }

  async function pintarLista() {
    ed = null;
    app.innerHTML = '<div class="cargando-pag" role="status">Cargando tus cartas…</div>';
    const d = await Cuenta.api('/cartas');
    if (d.status === 401) { Cuenta.poner(null); return; }
    const cartas = d.cartas || [];
    const n = cartas.length;
    app.innerHTML = `
      <div class="cab-lista"><div><h1>Mis cartas</h1><p>${n ? n + (n === 1 ? ' carta guardada' : ' cartas guardadas') : 'Aún no has guardado ninguna carta'}</p></div>
        <div class="fila-botones" style="margin:0"><button class="btn" type="button" id="nuevoMenu">+ Menú del día</button><a class="btn primario" href="/#herramienta">+ Nueva carta desde una foto</a></div></div>
      ${avisoPlanHTML()}
      ${franjaProHTML(cartas)}
      ${n ? `<div class="rejilla">${cartas.map(c => `
        <article class="tarjeta">
          <div class="tarjeta-img" data-id="${esc(c.id)}" onclick="location.hash='carta=${esc(c.id)}'" role="button" tabindex="0" aria-label="Editar ${esc(c.titulo)}"></div>
          <div class="tarjeta-cuerpo">
            <div class="tarjeta-tit">${esc(c.titulo)}</div>
            <div class="tarjeta-meta">${c.menu ? '<b class="etq-menu">Menú del día</b> · ' : ''}${c.platos} platos · ${esc(NOMBRE_ESTILO[c.estilo] || c.estilo)}${c.idioma && c.idioma !== 'es' ? ' · ' + esc(IDIOMAS[c.idioma] || c.idioma) : ''} · ${haceCuanto(c.actualizado)}</div>
            <div class="tarjeta-acc">
              <a class="btn peq oscuro" href="#carta=${esc(c.id)}">Editar</a>
              <button class="icono-btn" type="button" title="Duplicar" aria-label="Duplicar ${esc(c.titulo)}" onclick="duplicar('${esc(c.id)}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              <button class="icono-btn rojo" type="button" title="Borrar" aria-label="Borrar ${esc(c.titulo)}" onclick="borrarCarta('${esc(c.id)}', this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
            </div>
          </div>
        </article>`).join('')}
        <a class="nueva-tarjeta" href="/#herramienta"><span class="mas">+</span>Nueva carta<small>Sube una foto y la guardas aquí</small></a>

  // Montaje gratis en un portamenús Kartia: se envía la carta tal cual está guardada

    caja.innerHTML = `<form class="kartia-form" novalidate>

    const form = caja.querySelector('form');
    form.onsubmit = async ev => {
      ev.preventDefault();
      const b = form.querySelector('button[type=submit]');

  // Miniatura real: cada tarjeta compone su propia carta (con el mismo motor del PDF) cuando entra en pantalla
  function miniaturas() {
    const ANCHO = 794, ALTO = 1123;
    const cargar = async el => {
      const d = await Cuenta.api('/cartas/' + el.dataset.id);
      if (!d.ok || !el.isConnected) return;
      const f = document.createElement('iframe');
      f.src = '/carta/vista.html'; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.setAttribute('scrolling', 'no');
      const escala = () => { const s = el.clientWidth * .78 / ANCHO; f.style.transform = 'scale(' + s + ')'; f.style.left = (el.clientWidth * .11) + 'px'; };
      f.style.width = ANCHO + 'px'; f.style.height = ALTO + 'px';
      el.appendChild(f); escala();
      new ResizeObserver(escala).observe(el);
      const oir = e => {
        if (e.origin !== location.origin || e.source !== f.contentWindow || !e.data) return;
        if (e.data.tipo === 'vista-lista') f.contentWindow.postMessage({ tipo: 'componer', id: 1, carta: d.carta, estilo: d.estilo, formato: d.formato === 'slim' ? 'slim' : 'a4', logo: d.logo && d.cabecera === 'logo' ? d.logo : null, credito: false }, location.origin);
        if (e.data.tipo === 'compuesta') { el.classList.add('lista'); removeEventListener('message', oir); }
      };
      addEventListener('message', oir);
    };
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); cargar(e.target); } }), { rootMargin: '200px' });
    app.querySelectorAll('.tarjeta-img[data-id]').forEach(el => io.observe(el));
  }

    if (!Cuenta.esPro()) return Cuenta.planes({ motivo: 'El menú del día es de Carta Pro.', vuelta: 'panel' });

      secciones: ['Primeros', 'Segundos', 'Postres'].map(nombre => ({ nombre, platos: [plato(), plato(), plato()] })) };
    const d = await Cuenta.api('/cartas', { titulo: 'Menú del día', carta, estilo: base.estilo || 'pizarra', logo: base.logo || null, cabecera: base.cabecera || 'logo' });
    if (b) b.disabled = false;

    // Pestañas en móvil

    const seg = document.getElementById('segCab');

      segF.querySelectorAll('button').forEach(b => b.onclick = () => {
        delete m.fecha_auto; delete m.fecha_no;
        if (b.dataset.v === 'auto') { m.fecha_auto = true; m.fecha = hoyTexto(); }
        else if (b.dataset.v === 'no') { m.fecha_no = true; m.fecha = ''; }
