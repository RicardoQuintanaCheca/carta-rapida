<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mis cartas · Carta Rápida</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<link rel="stylesheet" href="/cuenta.css">
<style>
  :root { color-scheme: light; --ink: #0C0C0D; --cta: #FF4A1C; --coral: #FF4A1C; --crema: #FFFFFF; --linea: #E6E6EA; --gris: #6C6C72; --tinta-coral: #C93A0E; --suave: #F3F3F5; --f: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #fff; color: var(--ink); font-family: var(--f); font-size: 15.5px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  a { color: var(--tinta-coral); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--cta); outline-offset: 2px; border-radius: 6px; }

  /* Barra superior: la misma de la portada */
  .barra { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.9); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--linea); }
  .barra-in { max-width: 1320px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; gap: 14px; }
  .logo { text-decoration: none; color: var(--ink); font-weight: 800; font-size: 19px; letter-spacing: -.03em; white-space: nowrap; }
  .logo span { color: var(--cta); }
  .barra-esp { flex: 1; }
  .plan-pill { font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 8px; background: var(--suave); color: var(--gris); white-space: nowrap; }
  .plan-pill.pro { background: #EAF3EC; color: #1F5E33; }
  .plan-pill.prueba { background: #FDF1EA; color: var(--tinta-coral); }
  .btn-pro-barra { border: none; background: var(--cta); color: #fff; font-weight: 700; font-size: 14px; padding: 0 16px; min-height: 40px; border-radius: 10px; cursor: pointer; white-space: nowrap; transition: background-color .2s; }
  .btn-pro-barra:hover { background: var(--ink); }
  .menu-cuenta { position: relative; }
  .menu-cuenta > button { width: 40px; height: 40px; border-radius: 10px; border: none; background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; text-transform: uppercase; }
  .menu-lista { position: absolute; right: 0; top: 50px; background: #fff; border: 1px solid var(--linea); border-radius: 14px; box-shadow: 0 30px 60px -24px rgba(12,12,13,.35); padding: 8px; min-width: 260px; z-index: 60; }
  .menu-lista .menu-email { font-size: 13px; color: var(--gris); padding: 8px 10px 10px; border-bottom: 1px solid var(--linea); margin-bottom: 6px; word-break: break-all; }
  .menu-lista button, .menu-lista a { display: block; width: 100%; text-align: left; border: none; background: none; padding: 10px; border-radius: 8px; font-size: 14.5px; font-weight: 500; cursor: pointer; color: var(--ink); text-decoration: none; }
  .menu-lista button:hover, .menu-lista a:hover { background: var(--suave); }
  .menu-lista .peligro { color: #B3261E; }

  .envoltura { max-width: 1320px; margin: 0 auto; padding: 40px 24px 96px; }

  /* Acceso sin sesión */
  .bienvenida { max-width: 620px; margin: 56px auto; text-align: left; }
  .bienvenida h1 { font-size: clamp(36px, 6vw, 60px); line-height: 1; letter-spacing: -.045em; font-weight: 750; margin: 0 0 18px; text-wrap: balance; }
  .bienvenida p { color: var(--gris); font-size: 18px; line-height: 1.55; margin: 0 0 28px; }
  .fila-botones { display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; color: var(--ink); border-radius: 10px; padding: 0 20px; min-height: 48px; font-weight: 650; font-size: 15.5px; cursor: pointer; text-decoration: none; transition: box-shadow .2s, background-color .2s, color .2s; }
  .btn:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn.primario { background: var(--cta); color: #fff; box-shadow: none; }
  .btn.primario:hover { background: var(--ink); }
  .btn.oscuro { background: var(--ink); color: #fff; box-shadow: none; }
  .btn.oscuro:hover { background: var(--cta); }
  .btn.peq { padding: 0 14px; min-height: 38px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* Lista de cartas */
  .cab-lista { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--linea); }
  .cab-lista h1 { font-size: clamp(34px, 4.4vw, 54px); letter-spacing: -.045em; font-weight: 750; margin: 0; line-height: 1; }
  .cab-lista p { margin: 10px 0 0; color: var(--gris); font-size: 16px; }
  .aviso-plan { display: flex; align-items: center; gap: 16px; justify-content: space-between; flex-wrap: wrap; border-radius: 16px; padding: 20px 22px; background: var(--suave); margin-bottom: 28px; }
  .aviso-plan.prueba { background: #FDF1EA; }
  .aviso-plan.caducado { background: #FBECE9; }
  .aviso-plan b { font-size: 19px; letter-spacing: -.02em; display: block; margin-bottom: 3px; }
  .aviso-plan span { color: var(--gris); font-size: 14.5px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  /* Cada carta guardada: la hoja sobre la mesa */
  .tarjeta { display: flex; flex-direction: column; }
  .tarjeta-img { aspect-ratio: 210 / 235; background-color: var(--suave); background-position: center 18px; background-size: 78% auto; background-repeat: no-repeat; border-radius: 14px; cursor: pointer; transition: background-color .2s, background-position .35s cubic-bezier(.2,.8,.2,1); }
  .tarjeta:hover .tarjeta-img { background-color: #EFEAE2; }
  .tarjeta-img { position: relative; overflow: hidden; }
  .tarjeta-img iframe { position: absolute; top: 18px; border: 0; pointer-events: none; transform-origin: top left; opacity: 0; transition: opacity .35s ease, translate .35s cubic-bezier(.2,.8,.2,1); }
  .tarjeta-img.lista iframe { opacity: 1; }
  .tarjeta:hover .tarjeta-img iframe { translate: 0 -8px; }
  .tarjeta-cuerpo { padding: 14px 2px 0; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .tarjeta-tit { font-weight: 700; font-size: 17px; letter-spacing: -.02em; line-height: 1.25; }
  .tarjeta-meta { font-size: 13.5px; color: var(--gris); }
  .tarjeta-acc { display: flex; gap: 6px; margin-top: 12px; }
  .tarjeta-acc .btn { flex: 1; }
  .icono-btn { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 10px; border: none; box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); padding: 0; }
  .icono-btn:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .icono-btn.rojo:hover { box-shadow: inset 0 0 0 1.5px #B3261E; color: #B3261E; }
  .vacio { text-align: left; padding: clamp(32px, 6vw, 72px); border-radius: 20px; background: var(--suave); }
  .vacio h2 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.04em; font-weight: 750; line-height: 1.05; margin: 0 0 12px; }
  .vacio p { color: var(--gris); margin: 0 0 24px; max-width: 34em; font-size: 16.5px; }
  .nueva-tarjeta { border: 1.5px dashed #D9D1C6; border-radius: 14px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 4px; padding: 20px; min-height: 260px; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 17px; letter-spacing: -.02em; background: transparent; transition: border-color .2s, background-color .2s; }
  .nueva-tarjeta:hover { border-color: var(--cta); background: #FDF4EF; }
  .nueva-tarjeta .mas { width: 44px; height: 44px; border-radius: 10px; background: var(--cta); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500; margin-bottom: auto; }
  .nueva-tarjeta small { font-weight: 500; font-size: 13.5px; letter-spacing: 0; color: var(--gris); }

  /* Editor: a la izquierda la hoja de trabajo, a la derecha la carta */
  .ed-barra { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--linea); }
  .volver { border: none; background: none; cursor: pointer; font-weight: 600; color: var(--gris); padding: 8px 0; }
  .volver:hover { color: var(--ink); }
  .ed-titulo { flex: 1; min-width: 200px; border: none; box-shadow: inset 0 0 0 1.5px transparent; background: transparent; font-weight: 750; font-size: 28px; letter-spacing: -.035em; padding: 6px 10px; border-radius: 10px; }
  .ed-titulo:hover, .ed-titulo:focus { box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; outline: none; }
  .ed-titulo:focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .guardado { font-size: 13.5px; color: var(--gris); white-space: nowrap; }
  .guardado.error { color: #B3261E; }
  .ed { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 540px); gap: clamp(28px, 4vw, 56px); align-items: start; }
  .ed-form { min-width: 0; }
  .ed-vista { position: sticky; top: 88px; }
  .bloque { padding: 26px 0; border-bottom: 1px solid var(--linea); }
  .bloque:last-child { border-bottom: none; }
  .bloque-tit { font-size: 21px; letter-spacing: -.03em; font-weight: 750; color: var(--ink); margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .campo { width: 100%; padding: 11px 13px; border: none; box-shadow: inset 0 0 0 1.5px var(--linea); border-radius: 10px; background: #fff; outline: none; font-size: 15px; transition: box-shadow .15s; }
  .campo:hover { box-shadow: inset 0 0 0 1.5px #D5CCBF; }
  .campo:focus { box-shadow: inset 0 0 0 1.5px var(--ink), 0 0 0 4px rgba(12,12,13,.06); }
  .campo.grande { font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .etq { display: block; font-size: 13.5px; font-weight: 600; margin: 0 0 6px; color: var(--ink); }
  .grupo { margin-bottom: 12px; }
  .cab-nombre, .cab-logo { margin-top: 14px; }
  .segmento { display: inline-flex; background: var(--suave); border-radius: 10px; padding: 4px; gap: 2px; }
  .segmento button { border: none; background: transparent; padding: 8px 16px; border-radius: 7px; font-size: 14px; font-weight: 600; color: var(--gris); cursor: pointer; }
  .segmento button.on { background: var(--ink); color: #fff; }
  .logo-fila { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .logo-img { height: 52px; max-width: 170px; object-fit: contain; border-radius: 8px; padding: 6px; background: var(--suave); }
  .subir-logo { position: relative; overflow: hidden; }
  .subir-logo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .estilos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .estilo-b { border: none; box-shadow: inset 0 0 0 1.5px var(--linea); border-radius: 10px; background: #fff; padding: 5px 5px 7px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; transition: box-shadow .15s; }
  .estilo-b:hover { box-shadow: inset 0 0 0 1.5px #CFC6BA; }
  .estilo-b span:first-child { display: block; aspect-ratio: 210 / 200; border-radius: 6px; background: #fff center top / 100% auto no-repeat; }
  .estilo-b span:last-child { font-size: 12.5px; font-weight: 650; text-align: center; }
  .estilo-b.on { box-shadow: inset 0 0 0 2px var(--ink); }
  .seccion { border-radius: 14px; padding: 16px; margin-bottom: 12px; background: var(--suave); }
  .seccion-cab { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .seccion-cab .campo { flex: 1; font-weight: 700; }
  .plato { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 6px 8px; padding: 12px 0; border-top: 1px solid #E4DDD2; }
  .plato:first-of-type { border-top: none; }
  .plato .desc { grid-column: 1 / 3; }
  .plato .mas-datos { grid-column: 1 / 3; display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
  .plato .acciones { grid-row: 1 / span 3; grid-column: 3; display: flex; flex-direction: column; gap: 4px; }
  .plato .campo { padding: 9px 11px; font-size: 14.5px; }
  .plato .campo.nombre { font-weight: 650; }
  .plato .precio { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .destacado { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--gris); white-space: nowrap; cursor: pointer; padding: 0 4px; }
  .destacado input { accent-color: var(--cta); width: 16px; height: 16px; }
  .mini-btn { width: 32px; height: 32px; border-radius: 8px; border: none; box-shadow: inset 0 0 0 1.5px #DDD5C9; background: #fff; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; color: var(--gris); }
  .mini-btn:hover { box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
  .mini-btn.rojo:hover { box-shadow: inset 0 0 0 1.5px #B3261E; color: #B3261E; }
  .anadir { border: 1.5px dashed #D2C9BC; background: transparent; border-radius: 10px; padding: 10px 12px; width: 100%; cursor: pointer; font-weight: 600; color: var(--gris); margin-top: 8px; transition: border-color .2s, color .2s; }
  .anadir:hover { border-color: var(--cta); color: var(--tinta-coral); }
  .anadir.seccion-nueva { padding: 15px; font-size: 15.5px; border-radius: 14px; }
  .servicio { display: grid; grid-template-columns: 1fr 96px 32px; gap: 6px; margin-bottom: 6px; }
  .frase { display: flex; gap: 8px; }
  .frase textarea { flex: 1; resize: vertical; min-height: 46px; }
  .ayuda { font-size: 13.5px; color: var(--gris); margin: 8px 0 0; line-height: 1.5; }
  fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
  fieldset:disabled .campo, fieldset:disabled button { opacity: .5; cursor: not-allowed; }

  .vista-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .vista-info { font-size: 13.5px; color: var(--gris); flex: 1; }
  .vista-marco { position: relative; background: var(--suave); border-radius: 18px; padding: 22px; overflow: hidden; max-height: calc(100vh - 230px); overflow-y: auto; overscroll-behavior: contain; }
  .vista-escala { margin: 0 auto; position: relative; }
  .vista-escala iframe { border: 0; transform-origin: top left; display: block; background: transparent; }
  .vista-cargando { position: absolute; top: 12px; right: 14px; font-size: 12.5px; font-weight: 600; background: var(--ink); color: #fff; padding: 6px 10px; border-radius: 8px; display: none; }
  .vista-marco.cargando .vista-cargando { display: block; }
  .descargar { width: 100%; margin-top: 12px; min-height: 54px; font-size: 16.5px; }
  .nota-vista { font-size: 13px; color: var(--gris); text-align: center; margin-top: 10px; }
  .pestanas { display: none; }


  /* Franja de Pro: lo que tienes, a un clic */
  .pro-franja { background: var(--ink); color: #fff; border-radius: 20px; padding: clamp(20px, 3vw, 30px); margin-bottom: 28px; }
  .pro-franja-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .pro-franja-cab b { font-size: clamp(21px, 2.4vw, 27px); letter-spacing: -.03em; font-weight: 750; display: flex; align-items: center; gap: 10px; }
  .pro-sello { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--cta); color: #fff; padding: 4px 8px; border-radius: 6px; }
  .pro-franja-cab span.sub { color: #B9B9C0; font-size: 14.5px; display: block; margin-top: 4px; font-weight: 500; letter-spacing: 0; }
  .pro-franja-cab button { border: none; background: none; color: #fff; font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 8px 0; }
  .pro-accesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .pro-acceso { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #fff; background: #1B1B1E; border-radius: 14px; padding: 16px 18px; transition: background-color .2s, translate .2s; }
  .pro-acceso:hover { background: #26262B; translate: 0 -2px; }
  .pro-acceso strong { font-size: 16px; letter-spacing: -.015em; font-weight: 700; }
  .pro-acceso small { color: #B9B9C0; font-size: 13.5px; line-height: 1.45; }
  .pro-acceso i { font-style: normal; color: var(--cta); font-weight: 700; font-size: 13.5px; margin-top: 8px; }

  /* Puente a Kartia: la carta, en su portamenús */
  .kartia { margin-top: 36px; border-radius: 20px; background: #F6F1EA; padding: clamp(22px, 3.4vw, 36px); display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 48px); align-items: center; }
  .kartia h2 { font-size: clamp(26px, 3.2vw, 38px); letter-spacing: -.04em; font-weight: 750; line-height: 1.05; margin: 0 0 12px; text-wrap: balance; }
  .kartia p { margin: 0; color: #55504A; font-size: 16px; line-height: 1.55; max-width: 34em; }
  .kartia .kartia-marca { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-coral); margin-bottom: 10px; }
  .kartia-form { background: #fff; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .kartia-form .btn { width: 100%; }
  .kartia-form .ayuda { margin: 0; overflow-wrap: anywhere; }
  .kartia-ok { font-weight: 650; font-size: 16px; line-height: 1.5; }
  .kartia-mini { margin-top: 14px; border-radius: 14px; background: #F6F1EA; padding: 16px; }
  .kartia-mini b { display: block; font-size: 15.5px; letter-spacing: -.015em; margin-bottom: 4px; }
  .kartia-mini p { margin: 0 0 12px; font-size: 13.5px; color: #55504A; line-height: 1.5; }
  .kartia-mini .kartia-form { padding: 0; background: none; }

  /* Pestañas del editor */
  .ed-tabs { display: flex; gap: 4px; background: var(--suave); border-radius: 12px; padding: 4px; margin: 18px 0 0; overflow-x: auto; scrollbar-width: none; }
  .ed-tabs::-webkit-scrollbar { display: none; }
  .ed-tabs button { flex: 1 0 auto; border: none; background: transparent; padding: 10px 16px; border-radius: 9px; font-size: 14.5px; font-weight: 650; color: var(--gris); cursor: pointer; white-space: nowrap; }
  .ed-tabs button:hover { color: var(--ink); }
  .ed-tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(12,12,13,.12); }
  #edFs[data-t="diseno"] .bloque:not([data-t="diseno"]), #edFs[data-t="platos"] .bloque:not([data-t="platos"]),
  #edFs[data-t="frase"] .bloque:not([data-t="frase"]), #edFs[data-t="traducir"] .bloque:not([data-t="traducir"]) { display: none; }
  #edFs .bloque { border-bottom: none; }
  #edFs[data-t="platos"] .bloque + .bloque[data-t="platos"], #edFs[data-t="diseno"] .bloque + .bloque[data-t="diseno"] { border-top: 1px solid var(--linea); }
  .bloque-intro { color: var(--gris); font-size: 15.5px; margin: -6px 0 16px; max-width: 36em; }
  .ejemplos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .ejemplos button { border: none; box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 550; cursor: pointer; color: var(--ink); }
  .ejemplos button:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .idiomas { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .idiomas button { border: none; box-shadow: inset 0 0 0 1.5px var(--linea); background: #fff; border-radius: 12px; padding: 14px; font-weight: 650; font-size: 15px; cursor: pointer; text-align: left; text-transform: capitalize; }
  .idiomas button:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .idiomas button:disabled { opacity: .5; cursor: default; }
  .estilo-b { position: relative; }
  .estilo-b em { position: absolute; top: 9px; right: 9px; font-style: normal; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--ink); color: #fff; padding: 2px 5px; border-radius: 4px; }
  .ed-barra .btn { flex: 0 0 auto; }

  .cargando-pag { text-align: center; padding: 80px 20px; color: var(--gris); }

  @media (max-width: 1000px) {
    .ed { grid-template-columns: 1fr; }
    .ed-vista { position: static; }
    .pestanas { display: flex; position: sticky; top: 68px; z-index: 40; background: #fff; padding: 8px 0 10px; }
    .pestanas .segmento { width: 100%; }

<body>

<header class="barra">

        <button type="button" id="menuPortal" onclick="Cuenta.portal()">Plan, facturas y darse de baja</button>

</header>

<main class="envoltura" id="app">
  <div class="cargando-pag" role="status">Cargando…</div>

<script src="/cuenta.js"></script>
<script>
  const ESTILOS = [['riviera','Riviera'],['azulejo','Azulejo'],['serigrafia','Serigrafía'],['cartel','Cartel'],['bloque','Bloque'],['marinero','Marinero'],['brunch','Brunch'],['vermut','Vermut'],['pizarra','Pizarra'],['ticket','Ticket'],['gaceta','Gaceta'],['trattoria','Trattoria'],['editorial','Editorial'],['sobremesa','Sobremesa'],['sumi','Sumi'],['brasserie','Brasserie'],['deco','Déco'],['mantel','Mantel'],['barra','Barra'],['autor','Autor']];
  const NOMBRE_ESTILO = Object.fromEntries(ESTILOS);
  const IDIOMAS = { en: 'inglés', fr: 'francés', de: 'alemán', it: 'italiano', pt: 'portugués', zh: 'chino' };
  const esc = Cuenta.esc;
  const app = document.getElementById('app');
  let ed = null; // estado del editor

  // Analítica: solo si ya aceptó las cookies en la web (aquí no se vuelve a preguntar)
  const _cola = []; let _gaLista = false;
  function medir(e, d) { try { if (_gaLista) gtag('event', e, d || {}); else _cola.push([e, d]); } catch (err) {} }
  (function () {
    let el = null; try { el = JSON.parse(localStorage.getItem('cr_consentimiento')); } catch (e) {}
    if (!el || !el.si || Date.now() - el.t > 365 * 864e5) return;
    fetch('/config').then(r => r.json()).then(c => {
      if (!c.ga4) return;
      window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); };
      gtag('consent', 'default', { ad_storage: 'granted', analytics_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'denied' });
      gtag('js', new Date()); gtag('config', c.ga4, { anonymize_ip: true });
      _gaLista = true; _cola.splice(0).forEach(([e, d]) => gtag('event', e, d || {}));
      const sc = document.createElement('script'); sc.async = true; sc.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(c.ga4); document.head.appendChild(sc);
    }).catch(() => {});
  })();

  // ── Barra ──
  function pintarBarra() {
    const c = Cuenta.estado;
    document.getElementById('menuCuenta').hidden = !c;
    const pill = document.getElementById('planPill');
    const pro = document.getElementById('btnProBarra');
    if (!c) { pill.hidden = true; pro.hidden = true; return; }
    document.getElementById('menuBoton').textContent = c.email.charAt(0);
    document.getElementById('menuEmail').textContent = c.email;
    document.getElementById('menuPortal').hidden = !c.puedePortal;
    document.getElementById('menuAdmin').hidden = !c.admin;
    pill.hidden = false;
    pill.className = 'plan-pill ' + c.plan;
    pill.textContent = Cuenta.textoPlan();
    pro.hidden = c.plan === 'pro';
  }
  const menuBoton = document.getElementById('menuBoton');
  menuBoton.onclick = (e) => {
    e.stopPropagation();
    const l = document.getElementById('menuLista');
    l.hidden = !l.hidden;
    menuBoton.setAttribute('aria-expanded', String(!l.hidden));
  };
  document.addEventListener('click', () => { document.getElementById('menuLista').hidden = true; });
  window.addEventListener('cuenta', () => { pintarBarra(); if (!ed) route(); else pintarBloqueo(); });

  // ── Rutas: /panel y /panel#carta=ID ──
  function route() {
    if (!Cuenta.estado) return pintarBienvenida();
    const m = location.hash.match(/^#carta=([\w-]+)/);
    if (m) abrirEditor(m[1]); else pintarLista();
  }
  window.addEventListener('hashchange', () => { if (ed && ed.pendiente) guardarYa(); ed = null; route(); });

  function pintarBienvenida() {
    ed = null;
    app.innerHTML = `<div class="bienvenida">
      <h1>Tus cartas, siempre a mano.</h1>
      <p>Guarda tus cartas y cámbialas cuando cambien los precios o la temporada: platos, precios, estilo y logo. Descarga el PDF al momento.</p>
      <div class="fila-botones">
        <button class="btn primario" type="button" onclick="Cuenta.acceso({ modo: 'crear', alEntrar: route })">Crear cuenta · 7 días gratis</button>
        <button class="btn" type="button" onclick="Cuenta.acceso({ modo: 'entrar', alEntrar: route })">Entrar</button>
      </div>
      <p style="margin-top:28px;font-size:14px">¿Aún no tienes tu carta? <a href="/#herramienta">Hazla gratis en 30 segundos →</a></p>
    </div>`;
  }

  function haceCuanto(ms) {
    const s = (Date.now() - ms) / 1000;
    if (s < 60) return 'hace un momento';
    if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';
    return new Date(ms).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
  }

  function avisoPlanHTML() {
    const c = Cuenta.estado;
    if (c.plan === 'pro') return '';
    if (c.plan === 'prueba') {
      const dias = Math.max(1, Math.ceil((c.hasta - Date.now()) / 864e5));
      return `<div class="aviso-plan prueba"><div><b>Tu prueba de Pro: ${dias === 1 ? 'queda 1 día' : 'quedan ' + dias + ' días'}</b><span>Hazte Pro para seguir editando tus cartas cuando termine. Desde 9,90 € al mes.</span></div>
        <button class="btn primario" type="button" onclick="Cuenta.planes({ vuelta: 'panel' })">Hazte Pro</button></div>`;
    }
    return `<div class="aviso-plan caducado"><div><b>${c.habiaPro ? 'Tu Carta Pro ha terminado' : 'Tu prueba de Pro ha terminado'}</b><span>Tus cartas siguen aquí. Actívala para editarlas, cambiar precios y descargarlas sin firma.</span></div>
      <button class="btn primario" type="button" onclick="Cuenta.planes({ vuelta: 'panel' })">Activar Pro</button></div>`;
  }

  async function pintarLista() {
    ed = null;
    app.innerHTML = '<div class="cargando-pag" role="status">Cargando tus cartas…</div>';
    const d = await Cuenta.api('/cartas');
    if (d.status === 401) { Cuenta.poner(null); return; }
    const cartas = d.cartas || [];
    const n = cartas.length;
    app.innerHTML = `
      <div class="cab-lista"><div><h1>Mis cartas</h1><p>${n ? n + (n === 1 ? ' carta guardada' : ' cartas guardadas') : 'Aún no has guardado ninguna carta'}</p></div>
        <a class="btn primario" href="/#herramienta">+ Nueva carta desde una foto</a></div>
      ${avisoPlanHTML()}
      ${franjaProHTML(cartas)}
      ${n ? `<div class="rejilla">${cartas.map(c => `
        <article class="tarjeta">
          <div class="tarjeta-img" data-id="${esc(c.id)}" onclick="location.hash='carta=${esc(c.id)}'" role="button" tabindex="0" aria-label="Editar ${esc(c.titulo)}"></div>
          <div class="tarjeta-cuerpo">
            <div class="tarjeta-tit">${esc(c.titulo)}</div>
            <div class="tarjeta-meta">${c.platos} platos · ${esc(NOMBRE_ESTILO[c.estilo] || c.estilo)}${c.idioma && c.idioma !== 'es' ? ' · ' + esc(IDIOMAS[c.idioma] || c.idioma) : ''} · ${haceCuanto(c.actualizado)}</div>
            <div class="tarjeta-acc">
              <a class="btn peq oscuro" href="#carta=${esc(c.id)}">Editar</a>
              <button class="icono-btn" type="button" title="Duplicar" aria-label="Duplicar ${esc(c.titulo)}" onclick="duplicar('${esc(c.id)}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              <button class="icono-btn rojo" type="button" title="Borrar" aria-label="Borrar ${esc(c.titulo)}" onclick="borrarCarta('${esc(c.id)}', this)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
            </div>
          </div>
        </article>`).join('')}
        <a class="nueva-tarjeta" href="/#herramienta"><span class="mas">+</span>Nueva carta<small>Sube una foto y la guardas aquí</small></a>
      </div>` : `<div class="vacio"><h2>Tu primera carta, en 30 segundos</h2><p>Hazle una foto a tu carta, elige estilo y pulsa «Guardar en mis cartas». Aparecerá aquí para editarla cuando quieras.</p><a class="btn primario" href="/#herramienta">Hacer mi carta</a></div>`}
      ${n ? `<section class="kartia" aria-labelledby="kartiaTit">
        <div><div class="kartia-marca">Kartia · portamenús hechos a mano en España</div>
          <h2 id="kartiaTit">Tu carta ya está. Ahora, dónde la presentas.</h2>
          <p>Te enviamos gratis un montaje de tu carta dentro de un portamenús Kartia, en el material que mejor encaje con tu local. Lo ves antes de decidir nada.</p></div>
        <div id="kartiaCaja"></div></section>` : ''}`;
    if (n) cajaMontaje(document.getElementById('kartiaCaja'), cartas, 'panel');
    app.querySelectorAll('.tarjeta-img').forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); } }));
    miniaturas();
  }


  // Con Pro (o en la prueba): lo que tienes desbloqueado, a un clic de la carta más reciente
  const ESTILOS_PRO = ['riviera', 'sumi', 'cartel', 'serigrafia', 'azulejo', 'marinero', 'brunch', 'vermut'];
  function franjaProHTML(cartas) {
    const c = Cuenta.estado;
    if (c.plan !== 'pro' && c.plan !== 'prueba') return '';
    const id = cartas[0] && cartas[0].id;
    const a = t => id ? `#carta=${esc(id)}&t=${t}` : '/#herramienta';
    const ir = id ? 'Abrir en mi carta →' : 'Crea tu primera carta →';
    const sub = c.plan === 'pro'
      ? (c.cancela ? `Activa hasta el ${Cuenta.fmtFecha(c.hasta)}. No se renovará.` : `Plan ${c.periodo === 'ano' ? 'anual' : 'mensual'} · se renueva el ${Cuenta.fmtFecha(c.hasta)}`)
      : 'Estás probando todo lo de Pro. Esto es lo que incluye.';
    return `<section class="pro-franja" aria-label="Tu Carta Pro">
      <div class="pro-franja-cab"><div><b><span class="pro-sello">Pro</span>${c.plan === 'pro' ? 'Carta Pro activa' : 'Carta Pro, en prueba'}</b><span class="sub">${esc(sub)}</span></div>
        ${c.plan === 'pro' && c.puedePortal ? '<button type="button" onclick="Cuenta.portal()">Facturas, tarjeta y baja</button>' : ''}</div>
      <div class="pro-accesos">
        <a class="pro-acceso" href="${a('traducir')}"><strong>Tradúcela a 6 idiomas</strong><small>Inglés, francés, alemán, italiano, portugués y chino, con vocabulario de hostelería.</small><i>${ir}</i></a>
        <a class="pro-acceso" href="${a('frase')}"><strong>Cambia precios con una frase</strong><small>Escribe el cambio como se lo dirías a una persona y se aplica a toda la carta.</small><i>${ir}</i></a>
        <a class="pro-acceso" href="${a('diseno')}"><strong>Tu logotipo y los 20 estilos</strong><small>Los 8 estilos Pro y tu logo arriba, sin la firma de Carta Rápida.</small><i>${ir}</i></a>
        <a class="pro-acceso" href="${a('platos')}"><strong>Edita platos al momento</strong><small>Sube, baja, añade o quita platos y descarga el PDF nuevo en segundos.</small><i>${ir}</i></a>
      </div></section>`;
  }

  // Montaje gratis en un portamenús Kartia: se envía la carta tal cual está guardada
  function cajaMontaje(caja, cartas, origen, actual) {
    if (!caja) return;
    const varias = !actual && cartas.length > 1;
    caja.innerHTML = `<form class="kartia-form" novalidate>
      ${varias ? `<div><label class="etq" for="kCarta_${origen}">¿Qué carta?</label><select class="campo" id="kCarta_${origen}">${cartas.map(c => `<option value="${esc(c.id)}">${esc(c.titulo)}</option>`).join('')}</select></div>` : ''}
      <div><label class="etq" for="kTel_${origen}">Teléfono (opcional)</label><input class="campo" id="kTel_${origen}" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="Por si prefieres que te llamemos"></div>
      <button class="btn oscuro" type="submit">Quiero ver el montaje</button>
      <p class="ayuda">Gratis y sin compromiso. Te lo enviamos a ${esc(Cuenta.estado.email)} en 1–2 días laborables. <a href="/legal/privacidad.html" target="_blank" rel="noopener">Privacidad</a></p></form>`;
    const form = caja.querySelector('form');
    form.onsubmit = async ev => {
      ev.preventDefault();
      const b = form.querySelector('button[type=submit]');
      b.disabled = true; b.textContent = 'Enviando…';
      try {
        let datos = actual ? actual() : null;
        if (!datos) {
          const sel = form.querySelector('select');
          const d = await Cuenta.api('/cartas/' + (sel ? sel.value : cartas[0].id));
          if (!d.ok) throw new Error(d.error || 'No encontramos esa carta.');
          datos = { carta: d.carta, estilo: d.estilo, logo: d.logo && d.cabecera === 'logo' ? d.logo : null };
        }
        const r = await Cuenta.api('/solicitar-montaje', { email: Cuenta.estado.email, telefono: form.querySelector('input[type=tel]').value.trim(), origen: 'carta-rapida-montaje', ...datos });
        if (!r.ok) throw new Error(r.error || 'No se ha podido enviar.');
        medir('generate_lead', { origen: 'montaje-' + origen });
        caja.innerHTML = '<div class="kartia-form"><div class="kartia-ok">Hecho. En 1–2 días laborables tienes el montaje en tu email.</div><p class="ayuda">Si tienes prisa, escríbenos a <a href="mailto:hola@cartarapida.es">hola@cartarapida.es</a>.</p></div>';
      } catch (e) { Cuenta.aviso(e.message); b.disabled = false; b.textContent = 'Quiero ver el montaje'; }
    };
  }

  // Miniatura real: cada tarjeta compone su propia carta (con el mismo motor del PDF) cuando entra en pantalla
  function miniaturas() {
    const ANCHO = 794, ALTO = 1123;
    const cargar = async el => {
      const d = await Cuenta.api('/cartas/' + el.dataset.id);
      if (!d.ok || !el.isConnected) return;
      const f = document.createElement('iframe');
      f.src = '/carta/vista.html'; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.setAttribute('scrolling', 'no');
      const escala = () => { const s = el.clientWidth * .78 / ANCHO; f.style.transform = 'scale(' + s + ')'; f.style.left = (el.clientWidth * .11) + 'px'; };
      f.style.width = ANCHO + 'px'; f.style.height = ALTO + 'px';
      el.appendChild(f); escala();
      new ResizeObserver(escala).observe(el);
      const oir = e => {
        if (e.origin !== location.origin || e.source !== f.contentWindow || !e.data) return;
        if (e.data.tipo === 'vista-lista') f.contentWindow.postMessage({ tipo: 'componer', id: 1, carta: d.carta, estilo: d.estilo, logo: d.logo && d.cabecera === 'logo' ? d.logo : null, credito: false }, location.origin);
        if (e.data.tipo === 'compuesta') { el.classList.add('lista'); removeEventListener('message', oir); }
      };
      addEventListener('message', oir);
    };
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); cargar(e.target); } }), { rootMargin: '200px' });
    app.querySelectorAll('.tarjeta-img[data-id]').forEach(el => io.observe(el));
  }

  async function duplicar(id) {
    const d = await Cuenta.api('/cartas/' + id + '/duplicar', {});
    if (d.status === 402) return Cuenta.planes({ motivo: 'Duplicar y editar cartas es de Carta Pro.', vuelta: 'panel' });
    if (!d.ok) return Cuenta.aviso(d.error || 'No se ha podido duplicar.');
    Cuenta.aviso('Carta duplicada.');
    pintarLista();
  }
  async function borrarCarta(id, btn) {
    if (btn.dataset.confirmar !== '1') {
      btn.dataset.confirmar = '1';
      btn.innerHTML = '¿Borrar?'; btn.style.width = 'auto'; btn.style.flex = '0 0 auto'; btn.style.padding = '0 10px'; btn.style.color = '#C62828'; btn.style.borderColor = '#C62828';
      setTimeout(() => { if (btn.isConnected && btn.dataset.confirmar === '1') pintarLista(); }, 4000);
      return;
    }
    const d = await Cuenta.api('/cartas/' + id, null, 'DELETE');
    Cuenta.aviso(d.ok ? 'Carta borrada.' : 'No se ha podido borrar.');
    pintarLista();
  }

  // ── Editor ──
  async function abrirEditor(id) {
    app.innerHTML = '<div class="cargando-pag" role="status">Abriendo tu carta…</div>';
    const d = await Cuenta.api('/cartas/' + id);
    if (!d.ok) { Cuenta.aviso(d.error || 'No encontramos esa carta.'); location.hash = ''; return; }
    const carta = d.carta;
    carta.secciones = carta.secciones || [];
    carta.servicios = carta.servicios || [];
    // Precios a la española para editar (12.5 → 12,50)
    const aEs = p => /^\d+\.\d+$/.test(String(p || '')) ? parseFloat(p).toFixed(2).replace('.', ',') : (p || '');
    carta.secciones.forEach(s => (s.platos || []).forEach(p => { p.precio = aEs(p.precio); }));
    carta.servicios.forEach(s => { s.precio = aEs(s.precio); });
    const t0 = (location.hash.match(/[&]t=(diseno|platos|frase|traducir)/) || [])[1];
    ed = { id, titulo: d.titulo, carta, estilo: d.estilo, logo: d.logo, cabecera: d.cabecera || 'logo', pendiente: false, guardando: false, vista: null, tab: t0 || 'diseno' };
    pintarEditor();
  }

  function puedeEditar() { return Cuenta.esPro(); }

  function pintarEditor() {
    const c = ed.carta;
    app.innerHTML = `
      <div class="ed-barra">
        <button class="volver" type="button" onclick="location.hash=''">← Mis cartas</button>
        <input class="ed-titulo" id="edTitulo" value="${esc(ed.titulo)}" maxlength="80" aria-label="Nombre de esta carta en tu panel">
        <span class="guardado" id="guardado" role="status">Guardado</span>
        <button class="btn primario peq js-descargar" type="button">Descargar PDF</button>
      </div>
      <div id="bloqueo"></div>
      <div class="pestanas"><div class="segmento"><button type="button" class="on" data-p="form">Editar</button><button type="button" data-p="vista">Ver carta</button></div></div>
      <div class="ed solo-form" id="ed">
        <div class="ed-form">
          <div class="ed-tabs" role="tablist" aria-label="Qué quieres cambiar">
            <button type="button" role="tab" data-t="diseno">Diseño</button><button type="button" role="tab" data-t="platos">Platos y precios</button><button type="button" role="tab" data-t="frase">Cambios rápidos</button><button type="button" role="tab" data-t="traducir">Traducir</button>
          </div>
          <fieldset id="edFs" data-t="${ed.tab}">
            <section class="bloque" data-t="diseno">
              <h2 class="bloque-tit">Cabecera</h2>
              <div class="etq">Arriba de la carta sale</div>

              <div class="ejemplos" aria-label="Ejemplos">${['Sube todos los precios un 5 % y redondea a 50 céntimos', 'Ordena cada sección de más barato a más caro', 'Quita los platos que no tienen precio', 'Pon la primera letra de cada plato en mayúscula'].map(x => `<button type="button" data-ej="${esc(x)}">${esc(x)}</button>`).join('')}</div>

              <div class="idiomas">${Object.entries(IDIOMAS).map(([k, n]) => `<button type="button" data-idioma="${k}">${n}</button>`).join('')}</div>

        <div class="ed-vista">
          <div class="vista-cab"><span class="vista-info" id="vistaInfo" aria-live="polite">Componiendo…</span></div>
          <div class="vista-marco" id="vistaMarco"><div class="vista-escala" id="vistaEscala"></div><div class="vista-cargando" role="status">Actualizando…</div></div>
          <button class="btn primario descargar js-descargar" type="button">Descargar PDF</button>

          <div class="kartia-mini"><b>¿Y dónde la vas a presentar?</b><p>Te enviamos gratis un montaje de esta carta en un portamenús Kartia, hecho a mano en España.</p><div id="kartiaEd"></div></div>
        </div>
      </div>`;

    // Pestañas en móvil
    app.querySelectorAll('.pestanas button').forEach(b => b.onclick = () => {
      app.querySelectorAll('.pestanas button').forEach(x => x.classList.toggle('on', x === b));
      const e = document.getElementById('ed');
      e.classList.toggle('solo-form', b.dataset.p === 'form');
      e.classList.toggle('solo-vista', b.dataset.p === 'vista');
      if (b.dataset.p === 'vista') ajustarVista();
      window.scrollTo({ top: 0 });
    });

    document.getElementById('edTitulo').oninput = e => { ed.titulo = e.target.value; cambio(false); };
    app.querySelectorAll('[data-k]').forEach(inp => inp.oninput = () => { ed.carta[inp.dataset.k] = inp.value; cambio(); });
    const seg = document.getElementById('segCab');
    const pintarSeg = () => {
      const conLogo = !!(ed.logo && ed.cabecera === 'logo');
      seg.querySelectorAll('button').forEach(b => { const on = b.dataset.v === (conLogo ? 'logo' : 'nombre'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
      document.getElementById('cabNombre').hidden = conLogo;
      document.getElementById('cabLogo').hidden = !conLogo;
    };
    seg.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (b.dataset.v === 'logo' && !ed.logo) { document.getElementById('fLogo').click(); return; }
      ed.cabecera = b.dataset.v; pintarSeg(); cambio();
    });
    pintarSeg();
    document.getElementById('fLogo').onchange = e => cargarLogo(e.target.files[0]);
    const quitar = document.getElementById('quitarLogo');
    if (quitar) quitar.onclick = () => { ed.logo = null; ed.cabecera = 'nombre'; cambio(); pintarEditor(); };
    app.querySelectorAll('.estilo-b').forEach(b => b.onclick = () => {
      ed.estilo = b.dataset.estilo;
      app.querySelectorAll('.estilo-b').forEach(x => x.classList.toggle('on', x === b));
      cambio();
    });
    document.getElementById('nuevaSeccion').onclick = () => { ed.carta.secciones.push({ nombre: '', platos: [plato()] }); pintarSecciones(true); cambio(); };
    document.getElementById('nuevoServicio').onclick = () => { ed.carta.servicios.push({ nombre: '', precio: '' }); pintarServicios(true); cambio(); };
    document.getElementById('aplicarFrase').onclick = aplicarFrase;
    app.querySelectorAll('[data-ej]').forEach(b => b.onclick = () => { const t = document.getElementById('fFrase'); t.value = b.dataset.ej; t.focus(); });
    app.querySelectorAll('[data-idioma]').forEach(b => b.onclick = () => traducir(b.dataset.idioma, b));
    app.querySelectorAll('.js-descargar').forEach(b => b.onclick = descargar);
    const fs = document.getElementById('edFs');
    const ponTab = t => { ed.tab = t; fs.dataset.t = t; app.querySelectorAll('.ed-tabs button').forEach(b => { const on = b.dataset.t === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); }); };
    app.querySelectorAll('.ed-tabs button').forEach(b => b.onclick = () => ponTab(b.dataset.t));
    ponTab(ed.tab);
    cajaMontaje(document.getElementById('kartiaEd'), [], 'editor', () => ({ carta: ed.carta, estilo: ed.estilo, logo: logoActivo() }));
    pintarSecciones();
    pintarServicios();
    pintarBloqueo();
    prepararVista();
    renderVista();

  function pintarBloqueo() {
    if (!ed) return;
    const b = document.getElementById('bloqueo');
    const fs = document.getElementById('edFs');
    if (!b || !fs) return;
    const ok = puedeEditar();
    fs.disabled = !ok;
    document.getElementById('edTitulo').disabled = !ok;
    b.innerHTML = ok ? '' : avisoPlanHTML();
  }

  const plato = () => ({ nombre: '', descripcion: '', precio: '', racion: '', alergenos: '', destacado: false });

  function pintarSecciones(enfocarUltimo) {
    const cont = document.getElementById('secciones');
    const S = ed.carta.secciones;
    cont.innerHTML = S.map((s, si) => `
      <div class="seccion" data-si="${si}">
        <div class="seccion-cab">
          <input class="campo grande" data-s="nombre" value="${esc(s.nombre)}" placeholder="Nombre de la sección (Entrantes, Carnes…)" maxlength="80" aria-label="Nombre de la sección">
          <button class="mini-btn" type="button" data-acc="s-arriba" title="Subir sección" aria-label="Subir sección" ${si === 0 ? 'disabled' : ''}>↑</button>
          <button class="mini-btn" type="button" data-acc="s-abajo" title="Bajar sección" aria-label="Bajar sección" ${si === S.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="mini-btn rojo" type="button" data-acc="s-borrar" title="Borrar sección" aria-label="Borrar sección">✕</button>
        </div>
        ${(s.platos || []).map((p, pi) => `
          <div class="plato" data-pi="${pi}">
            <input class="campo nombre" data-p="nombre" value="${esc(p.nombre)}" placeholder="Plato" maxlength="120" aria-label="Nombre del plato">
            <input class="campo precio" data-p="precio" value="${esc(p.precio)}" placeholder="Precio" maxlength="20" inputmode="decimal" aria-label="Precio">
            <div class="acciones">
              <button class="mini-btn" type="button" data-acc="p-arriba" title="Subir" aria-label="Subir" ${pi === 0 ? 'disabled' : ''}>↑</button>
              <button class="mini-btn" type="button" data-acc="p-abajo" title="Bajar" aria-label="Bajar" ${pi === s.platos.length - 1 ? 'disabled' : ''}>↓</button>
              <button class="mini-btn rojo" type="button" data-acc="p-borrar" title="Quitar plato" aria-label="Quitar plato">✕</button>
            </div>
            <input class="campo desc" data-p="descripcion" value="${esc(p.descripcion)}" placeholder="Descripción (opcional)" maxlength="200" aria-label="Descripción">
            <div class="mas-datos">
              <input class="campo" data-p="racion" value="${esc(p.racion)}" placeholder="Ración (80 g, 6 uds.)" maxlength="40" aria-label="Ración">
              <input class="campo" data-p="alergenos" value="${esc(p.alergenos)}" placeholder="Alérgenos" maxlength="80" aria-label="Alérgenos">
              <label class="destacado"><input type="checkbox" data-p="destacado" ${p.destacado ? 'checked' : ''}> Destacar</label>
            </div>
          </div>`).join('')}
        <button class="anadir" type="button" data-acc="p-nuevo">+ Añadir plato</button>
      </div>`).join('') || '<p class="ayuda">Esta carta no tiene secciones. Añade la primera.</p>';

    cont.querySelectorAll('.seccion').forEach(secEl => {
      const si = +secEl.dataset.si;
      secEl.querySelector('[data-s="nombre"]').oninput = e => { S[si].nombre = e.target.value; cambio(); };
      secEl.querySelectorAll('.plato').forEach(pEl => {
        const pi = +pEl.dataset.pi;
        pEl.querySelectorAll('[data-p]').forEach(inp => {
          const k = inp.dataset.p;
          const ev = inp.type === 'checkbox' ? 'onchange' : 'oninput';
          inp[ev] = () => { S[si].platos[pi][k] = inp.type === 'checkbox' ? inp.checked : inp.value; cambio(); };
        });
      });
      secEl.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => {
        const acc = b.dataset.acc;
        const pi = b.closest('.plato') ? +b.closest('.plato').dataset.pi : -1;
        const P = S[si].platos;
        if (acc === 's-arriba' && si > 0) [S[si - 1], S[si]] = [S[si], S[si - 1]];
        else if (acc === 's-abajo' && si < S.length - 1) [S[si + 1], S[si]] = [S[si], S[si + 1]];
        else if (acc === 's-borrar') {
          if (P.some(p => p.nombre) && b.dataset.ok !== '1') { b.dataset.ok = '1'; b.textContent = '¿Seguro?'; b.style.width = 'auto'; b.style.padding = '0 8px'; return; }
          S.splice(si, 1);
        }
        else if (acc === 'p-arriba' && pi > 0) [P[pi - 1], P[pi]] = [P[pi], P[pi - 1]];
        else if (acc === 'p-abajo' && pi < P.length - 1) [P[pi + 1], P[pi]] = [P[pi], P[pi + 1]];
        else if (acc === 'p-borrar') P.splice(pi, 1);
        else if (acc === 'p-nuevo') { P.push(plato()); pintarSecciones(); cambio(); const ult = document.querySelector(`.seccion[data-si="${si}"] .plato:last-of-type .nombre`); if (ult) ult.focus(); return; }
        pintarSecciones(); cambio();
      });
    });
    if (enfocarUltimo) { const u = cont.querySelector('.seccion:last-child [data-s="nombre"]'); if (u) u.focus(); }
  }

  function pintarServicios(enfocar) {
    const cont = document.getElementById('servicios');
    const V = ed.carta.servicios;
    cont.innerHTML = V.map((s, i) => `<div class="servicio" data-i="${i}">
      <input class="campo" data-v="nombre" value="${esc(s.nombre)}" placeholder="Pan y cubierto" maxlength="60" aria-label="Concepto">
      <input class="campo precio" data-v="precio" value="${esc(s.precio)}" placeholder="Precio" maxlength="20" inputmode="decimal" aria-label="Precio">
      <button class="mini-btn rojo" type="button" title="Quitar" aria-label="Quitar">✕</button></div>`).join('');
    cont.querySelectorAll('.servicio').forEach(el => {
      const i = +el.dataset.i;
      el.querySelectorAll('[data-v]').forEach(inp => inp.oninput = () => { V[i][inp.dataset.v] = inp.value; cambio(); });
      el.querySelector('button').onclick = () => { V.splice(i, 1); pintarServicios(); cambio(); };
    });
    if (enfocar) { const u = cont.querySelector('.servicio:last-child input'); if (u) u.focus(); }
  }

  function cargarLogo(file) {
    if (!file) return;
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return Cuenta.aviso('El logotipo debe ser PNG, JPG o WEBP.');
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900, esc2 = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * esc2); cv.height = Math.round(img.height * esc2);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        ed.logo = cv.toDataURL('image/png');
        ed.cabecera = 'logo';
        cambio(); pintarEditor();
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  // ── Guardado automático ──
  let tGuardar = null, tVista = null;
  function cambio(conVista = true) {
    if (!ed || !puedeEditar()) return;
    ed.pendiente = true;
    const g = document.getElementById('guardado');
    g.textContent = 'Cambios sin guardar…'; g.classList.remove('error');
    clearTimeout(tGuardar);
    tGuardar = setTimeout(guardarYa, 1200);
    if (conVista) { clearTimeout(tVista); tVista = setTimeout(renderVista, 350); }
  }
  async function guardarYa() {
    if (!ed || !ed.pendiente || ed.guardando) return;
    ed.guardando = true; ed.pendiente = false;
    const g = document.getElementById('guardado');
    if (g) g.textContent = 'Guardando…';
    const d = await Cuenta.api('/cartas/' + ed.id, { titulo: ed.titulo, carta: ed.carta, estilo: ed.estilo, logo: ed.logo, cabecera: ed.cabecera }, 'PUT');
    ed.guardando = false;
    const g2 = document.getElementById('guardado');
    if (d.ok) { if (g2) g2.textContent = 'Guardado ✓'; }
    else {
      ed.pendiente = true;
      if (g2) { g2.textContent = d.error || 'No se ha podido guardar'; g2.classList.add('error'); }
      if (d.status === 402) { await Cuenta.cargar(); }
    }
    if (ed.pendiente && d.ok) guardarYa();
  }
  window.addEventListener('beforeunload', e => { if (ed && (ed.pendiente || ed.guardando)) { guardarYa(); e.preventDefault(); e.returnValue = ''; } });

  // ── Vista previa (mismo motor que el PDF) ──
  const vista = { iframe: null, lista: false, pendiente: false, id: 0, ancho: 794, alto: 1123 };
  function prepararVista() {
    vista.iframe = null; vista.lista = false;
    const f = document.createElement('iframe');
    f.title = 'Vista previa de tu carta';
    f.src = '/carta/vista.html';
    f.setAttribute('scrolling', 'no');
    f.tabIndex = -1;
    document.getElementById('vistaEscala').appendChild(f);
    vista.iframe = f;
    ajustarVista();
  }
  function logoActivo() { return ed.logo && ed.cabecera === 'logo' ? ed.logo : null; }
  function renderVista() {
    if (!ed || !vista.iframe) return;
    const m = document.getElementById('vistaMarco');
    if (m) m.classList.add('cargando');
    vista.pendiente = true;
    if (vista.lista) enviarVista();
  }
  function enviarVista() {
    vista.pendiente = false; vista.id++;
    vista.iframe.contentWindow.postMessage({ tipo: 'componer', id: vista.id, carta: ed.carta, estilo: ed.estilo, logo: logoActivo(), credito: !Cuenta.esPro() }, location.origin);
  }
  function ajustarVista() {
    if (!vista.iframe) return;
    const marco = document.getElementById('vistaMarco');
    if (!marco || !marco.clientWidth) return;
    const disp = marco.clientWidth - 36;
    const e = Math.min(1, disp / vista.ancho);
    vista.iframe.style.width = vista.ancho + 'px';
    vista.iframe.style.height = vista.alto + 'px';
    vista.iframe.style.transform = 'scale(' + e + ')';
    const escala = document.getElementById('vistaEscala');
    escala.style.width = Math.floor(vista.ancho * e) + 'px';
    escala.style.height = Math.ceil(vista.alto * e) + 'px';
  }
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || !vista.iframe || e.source !== vista.iframe.contentWindow) return;
    if (e.data.tipo === 'vista-lista') { vista.lista = true; if (vista.pendiente) enviarVista(); }
    else if (e.data.tipo === 'compuesta' && e.data.id === vista.id) {
      const m = document.getElementById('vistaMarco'); if (m) m.classList.remove('cargando');
      if (e.data.error || !e.data.info) return;
      vista.ancho = Math.ceil(e.data.ancho) || 794; vista.alto = Math.ceil(e.data.alto) || 1123;
      ajustarVista();
      const i = e.data.info;
      const vi = document.getElementById('vistaInfo');
      if (vi) vi.textContent = `A4 · ${i.paginas} ${i.paginas > 1 ? 'páginas' : 'página'} · ${i.platos} platos · ${NOMBRE_ESTILO[ed.estilo] || ed.estilo}`;
    }
  });
  window.addEventListener('resize', ajustarVista);

  // ── Descargar, frase y traducción ──
  async function descargar() {
    const bs = [...document.querySelectorAll('.js-descargar')];
    bs.forEach(b => { b.disabled = true; b.textContent = 'Preparando tu PDF…'; });
    try {
      if (ed.pendiente) await guardarYa();
      const r = await fetch('/pdf', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ carta: ed.carta, estilo: ed.estilo, logo: logoActivo() }) });
      if (!r.ok) {
        let d = {}; try { d = await r.json(); } catch (e) {}
        if (r.status === 402) return Cuenta.planes({ motivo: d.error, vuelta: 'panel' });
        throw new Error(d.error || 'No hemos podido generar el PDF.');
      }
      const blob = await r.blob();
      const n = (r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = n ? n[1] : 'carta.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      Cuenta.aviso('PDF descargado.');
    } catch (e) { Cuenta.aviso(e.message); }
    finally { bs.forEach(b => { b.disabled = false; b.textContent = 'Descargar PDF'; }); }
  }

  async function pedirAjuste(ajuste) {
    const r = await Cuenta.api('/rehacer', { carta: ed.carta, ajuste });
    if (!r.ok) throw new Error(r.error || 'No ha sido posible aplicar el cambio.');
    return r.carta;
  }
  async function aplicarFrase() {
    const t = document.getElementById('fFrase');
    const ajuste = t.value.trim();
    if (!ajuste) { t.focus(); return; }
    const b = document.getElementById('aplicarFrase');
    b.disabled = true; b.textContent = 'Aplicando…';
    try {
      const nueva = await pedirAjuste(ajuste);
      ed.carta = { ...ed.carta, ...nueva, nombre_restaurante: nueva.nombre_restaurante || ed.carta.nombre_restaurante };
      t.value = '';
      cambio(); pintarEditor();
      Cuenta.aviso('Cambio aplicado. Revisa la carta.');
    } catch (e) { Cuenta.aviso(e.message); }
    finally { const b2 = document.getElementById('aplicarFrase'); if (b2) { b2.disabled = false; b2.textContent = 'Aplicar'; } }
  }
  async function traducir(cod, b) {
    const todos = [...document.querySelectorAll('[data-idioma]')];
    todos.forEach(x => x.disabled = true); b.textContent = 'Traduciendo…';
    try {
      const nueva = await pedirAjuste(`Traduce TODA la carta al ${IDIOMAS[cod]} (código ${cod}) con terminología profesional de hostelería: secciones, platos, descripciones, subtítulo, servicios y nota al pie. No traduzcas el nombre del restaurante ni los precios. Pon "idioma" a "${cod}".`);
      nueva.idioma = cod;
      const d = await Cuenta.api('/cartas', { titulo: `${ed.titulo} (${IDIOMAS[cod]})`, carta: nueva, estilo: ed.estilo, logo: ed.logo, cabecera: ed.cabecera });
      if (!d.ok) throw new Error(d.error || 'No se ha podido guardar la copia.');
      Cuenta.aviso('Copia traducida guardada.');
      location.hash = 'carta=' + d.id;
    } catch (e) { Cuenta.aviso(e.message); }
    finally { todos.forEach(x => { if (x.isConnected) { x.disabled = false; x.textContent = IDIOMAS[x.dataset.idioma]; } }); }
  }

  // ── Cuenta ──
  function cambiarClave() {
    const sinClave = !!(Cuenta.estado && Cuenta.estado.sinClave);
    const velo = document.createElement('div');
    velo.className = 'cu-velo';
    velo.innerHTML = `<div class="cu-caja" role="dialog" aria-modal="true"><button class="cu-cerrar" type="button" aria-label="Cerrar">×</button>
      <h2 class="cu-titulo">${sinClave ? 'Crear contraseña' : 'Cambiar contraseña'}</h2>
      ${sinClave ? '<p class="cu-sub">Entras con Google. Si quieres, crea también una contraseña para entrar con tu email.</p>' : ''}
      <form novalidate><label class="cu-campo"${sinClave ? ' hidden' : ''}><span>Contraseña actual</span><input type="password" name="actual" autocomplete="current-password"></label>
      <label class="cu-campo"><span>Nueva contraseña (mínimo 8)</span><input type="password" name="nueva" autocomplete="new-password"></label>
      <button class="cu-btn" type="submit">Guardar</button><p class="cu-error"></p></form></div>`;
    document.body.appendChild(velo);
    const cerrarV = () => velo.remove();
    velo.querySelector('.cu-cerrar').onclick = cerrarV;
    velo.addEventListener('mousedown', e => { if (e.target === velo) cerrarV(); });
    const f = velo.querySelector('form');
    (sinClave ? f.nueva : f.actual).focus();
    f.onsubmit = async ev => {
      ev.preventDefault();
      const d = await Cuenta.api('/cuenta/clave', { actual: f.actual.value, nueva: f.nueva.value });
      if (!d.ok) { velo.querySelector('.cu-error').textContent = d.error; return; }
      cerrarV(); await Cuenta.cargar(); Cuenta.aviso(sinClave ? 'Contraseña creada.' : 'Contraseña cambiada.');
    };
  }
  function borrarCuenta() {
    const sinClave = !!(Cuenta.estado && Cuenta.estado.sinClave);
    const velo = document.createElement('div');
    velo.className = 'cu-velo';
    velo.innerHTML = `<div class="cu-caja" role="dialog" aria-modal="true"><button class="cu-cerrar" type="button" aria-label="Cerrar">×</button>
      <h2 class="cu-titulo">Borrar mi cuenta</h2>
      <p class="cu-sub">Se borran tu cuenta y todas tus cartas guardadas, y se cancela tu suscripción si la tienes. No se puede deshacer.</p>
      <form novalidate><label class="cu-campo"><span>${sinClave ? 'Escribe BORRAR para confirmar' : 'Escribe tu contraseña para confirmar'}</span><input type="${sinClave ? 'text' : 'password'}" name="clave" autocomplete="${sinClave ? 'off' : 'current-password'}"></label>
      <button class="cu-btn" type="submit" style="background:#C62828">Borrar para siempre</button><p class="cu-error"></p></form></div>`;
    document.body.appendChild(velo);
    const cerrarV = () => velo.remove();
    velo.querySelector('.cu-cerrar').onclick = cerrarV;
    const f = velo.querySelector('form');
    f.clave.focus();
    f.onsubmit = async ev => {
      ev.preventDefault();
      const d = await Cuenta.api('/cuenta/borrar', sinClave ? { confirmar: f.clave.value } : { clave: f.clave.value });
      if (!d.ok) { velo.querySelector('.cu-error').textContent = d.error; return; }
      location.href = '/';
    };
  }

  // ── Inicio ──
  (async function () {
    await Cuenta.cargar();
    await Cuenta.vueltaDelPago();
    const params = new URLSearchParams(location.search);
    if (params.get('portal')) { history.replaceState(null, '', '/panel' + location.hash); await Cuenta.cargar(); }
    // Enlace del correo de «Olvidé mi contraseña»
    const tokenClave = params.get('restablecer');
    if (tokenClave) { history.replaceState(null, '', '/panel'); Cuenta.restablecer(tokenClave, { alEntrar: route }); }
    // Acceso al panel de administración: /admin manda aquí si no hay sesión de administrador
    if (params.get('admin') === '1') {
      history.replaceState(null, '', '/panel');
      if (Cuenta.estado) Cuenta.aviso('Esta cuenta no tiene acceso de administrador. Entra con el email de administración.', 7000);
      else Cuenta.acceso({ modo: 'entrar', motivo: 'Entra con tu cuenta de administración.', alEntrar: () => { location.href = '/admin'; } });
    }
  })();
</script>
</body>
</html>
