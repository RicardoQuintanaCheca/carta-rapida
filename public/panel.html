  function pintarBloqueo() {
    if (!ed) return;
    const b = document.getElementById('bloqueo');
    const fs = document.getElementById('edFs');
    if (!b || !fs) return;
    const ok = puedeEditar();
    fs.disabled = !ok;
    document.getElementById('edTitulo').disabled = !ok;
    b.innerHTML = ok ? '' : avisoPlanHTML();
  }

  const plato = () => ({ nombre: '', descripcion: '', precio: '', racion: '', alergenos: '', destacado: false });
  // Platos habituales del menú: los que ya has puesto otros días, para escribirlos con dos letras
  function pintarHabituales() {
    const dl = document.getElementById('habituales');
    if (dl && ed.carta.menu) dl.innerHTML = (ed.carta.menu.habituales || []).map(n => `<option value="${esc(n)}">`).join('');
  }
  function anotarHabituales() {
    const m = ed && ed.carta.menu;
    if (!m) return;
    const hoy = ed.carta.secciones.flatMap(s => (s.platos || []).map(p => String(p.nombre || '').trim())).filter(n => n.length > 2);
    const clave = n => n.toLocaleLowerCase('es');
    const vistos = new Set(hoy.map(clave));
    m.habituales = [...hoy, ...(m.habituales || []).filter(n => !vistos.has(clave(n)))].slice(0, 120);
  }

  function pintarSecciones(enfocarUltimo) {
    const cont = document.getElementById('secciones');
    const S = ed.carta.secciones;
    cont.innerHTML = S.map((s, si) => `
      <div class="seccion" data-si="${si}">
        <div class="seccion-cab">
          <input class="campo grande" data-s="nombre" value="${esc(s.nombre)}" placeholder="Nombre de la sección (Entrantes, Carnes…)" maxlength="80" aria-label="Nombre de la sección">
          ${ed.carta.idioma2 ? `<input class="campo dos" data-s2="nombre2" value="${esc(s.nombre2 || '')}" placeholder="Sección en ${IDIOMAS[ed.carta.idioma2]}" maxlength="80" aria-label="Nombre de la sección en ${IDIOMAS[ed.carta.idioma2]}" lang="${ed.carta.idioma2}">` : ''}
          <button class="mini-btn" type="button" data-acc="s-arriba" title="Subir sección" aria-label="Subir sección" ${si === 0 ? 'disabled' : ''}>↑</button>
          <button class="mini-btn" type="button" data-acc="s-abajo" title="Bajar sección" aria-label="Bajar sección" ${si === S.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="mini-btn rojo" type="button" data-acc="s-borrar" title="Borrar sección" aria-label="Borrar sección">✕</button>
        </div>
        ${(s.platos || []).map((p, pi) => `
          <div class="plato" data-pi="${pi}">
            <input class="campo nombre" data-p="nombre" value="${esc(p.nombre)}" placeholder="Plato" maxlength="120" aria-label="Nombre del plato"${ed.carta.menu ? ' list="habituales" autocomplete="off"' : ''}>
            <input class="campo precio" data-p="precio" value="${esc(p.precio)}" placeholder="${ed.carta.menu ? 'Supl.' : 'Precio'}" maxlength="20" ${ed.carta.menu ? '' : 'inputmode="decimal" '}aria-label="${ed.carta.menu ? 'Suplemento, si lo tiene (por ejemplo +3)' : 'Precio'}">
            <div class="acciones">
              <button class="mini-btn" type="button" data-acc="p-arriba" title="Subir" aria-label="Subir" ${pi === 0 ? 'disabled' : ''}>↑</button>
              <button class="mini-btn" type="button" data-acc="p-abajo" title="Bajar" aria-label="Bajar" ${pi === s.platos.length - 1 ? 'disabled' : ''}>↓</button>
              <button class="mini-btn rojo" type="button" data-acc="p-borrar" title="Quitar plato" aria-label="Quitar plato">✕</button>
            </div>
            <input class="campo desc" data-p="descripcion" value="${esc(p.descripcion)}" placeholder="Descripción (opcional)" maxlength="200" aria-label="Descripción">
            ${ed.carta.idioma2 ? `<div class="dos-fila"><input class="campo dos" data-p="nombre2" value="${esc(p.nombre2 || '')}" placeholder="Plato en ${IDIOMAS[ed.carta.idioma2]}" maxlength="140" aria-label="Plato en ${IDIOMAS[ed.carta.idioma2]}" lang="${ed.carta.idioma2}"><input class="campo dos" data-p="descripcion2" value="${esc(p.descripcion2 || '')}" placeholder="Descripción en ${IDIOMAS[ed.carta.idioma2]}" maxlength="220" aria-label="Descripción en ${IDIOMAS[ed.carta.idioma2]}" lang="${ed.carta.idioma2}"></div>` : ''}
            <div class="mas-datos">
              <input class="campo" data-p="racion" value="${esc(p.racion)}" placeholder="Ración (80 g, 6 uds.)" maxlength="40" aria-label="Ración">
              <input class="campo" data-p="alergenos" value="${esc(p.alergenos)}" placeholder="Alérgenos" maxlength="80" aria-label="Alérgenos">
              <label class="destacado"><input type="checkbox" data-p="destacado" ${p.destacado ? 'checked' : ''}> Destacar</label>
            </div>
          </div>`).join('')}
        <button class="anadir" type="button" data-acc="p-nuevo">+ Añadir plato</button>
      </div>`).join('') || '<p class="ayuda">Esta carta no tiene secciones. Añade la primera.</p>';

    cont.querySelectorAll('.seccion').forEach(secEl => {
      const si = +secEl.dataset.si;
      secEl.querySelector('[data-s="nombre"]').oninput = e => { S[si].nombre = e.target.value; cambio(); };
      const s2i = secEl.querySelector('[data-s2]'); if (s2i) s2i.oninput = e => { S[si].nombre2 = e.target.value; cambio(); };
      secEl.querySelectorAll('.plato').forEach(pEl => {
        const pi = +pEl.dataset.pi;
        pEl.querySelectorAll('[data-p]').forEach(inp => {
          const k = inp.dataset.p;
          const ev = inp.type === 'checkbox' ? 'onchange' : 'oninput';
          inp[ev] = () => { S[si].platos[pi][k] = inp.type === 'checkbox' ? inp.checked : inp.value; cambio(); };
        });
      });
      secEl.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => {
        const acc = b.dataset.acc;
        const pi = b.closest('.plato') ? +b.closest('.plato').dataset.pi : -1;
        const P = S[si].platos;
        if (acc === 's-arriba' && si > 0) [S[si - 1], S[si]] = [S[si], S[si - 1]];
        else if (acc === 's-abajo' && si < S.length - 1) [S[si + 1], S[si]] = [S[si], S[si + 1]];
        else if (acc === 's-borrar') {
          if (P.some(p => p.nombre) && b.dataset.ok !== '1') { b.dataset.ok = '1'; b.textContent = '¿Seguro?'; b.style.width = 'auto'; b.style.padding = '0 8px'; return; }
          S.splice(si, 1);
        }
        else if (acc === 'p-arriba' && pi > 0) [P[pi - 1], P[pi]] = [P[pi], P[pi - 1]];
        else if (acc === 'p-abajo' && pi < P.length - 1) [P[pi + 1], P[pi]] = [P[pi], P[pi + 1]];
        else if (acc === 'p-borrar') P.splice(pi, 1);
        else if (acc === 'p-nuevo') { P.push(plato()); pintarSecciones(); cambio(); const ult = document.querySelector(`.seccion[data-si="${si}"] .plato:last-of-type .nombre`); if (ult) ult.focus(); return; }
        pintarSecciones(); cambio();
      });
    });
    if (enfocarUltimo) { const u = cont.querySelector('.seccion:last-child [data-s="nombre"]'); if (u) u.focus(); }
  }

  function pintarServicios(enfocar) {
    const cont = document.getElementById('servicios');
    const V = ed.carta.servicios;
    cont.innerHTML = V.map((s, i) => `<div class="servicio" data-i="${i}">
      <input class="campo" data-v="nombre" value="${esc(s.nombre)}" placeholder="Pan y cubierto" maxlength="60" aria-label="Concepto">
      <input class="campo precio" data-v="precio" value="${esc(s.precio)}" placeholder="Precio" maxlength="20" inputmode="decimal" aria-label="Precio">
      <button class="mini-btn rojo" type="button" title="Quitar" aria-label="Quitar">✕</button></div>`).join('');
    cont.querySelectorAll('.servicio').forEach(el => {
      const i = +el.dataset.i;
      el.querySelectorAll('[data-v]').forEach(inp => inp.oninput = () => { V[i][inp.dataset.v] = inp.value; cambio(); });
      el.querySelector('button').onclick = () => { V.splice(i, 1); pintarServicios(); cambio(); };
    });
    if (enfocar) { const u = cont.querySelector('.servicio:last-child input'); if (u) u.focus(); }
  }

  function cargarLogo(file) {
    if (!file) return;
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return Cuenta.aviso('El logotipo debe ser PNG, JPG o WEBP.');
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900, esc2 = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * esc2); cv.height = Math.round(img.height * esc2);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        ed.logo = cv.toDataURL('image/png');
        ed.cabecera = 'logo';
        cambio(); pintarEditor();
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  // ── Guardado automático ──
  let tGuardar = null, tVista = null;
  function cambio(conVista = true) {
    if (!ed || !puedeEditar()) return;
    ed.pendiente = true;
    const g = document.getElementById('guardado');
    g.textContent = 'Cambios sin guardar…'; g.classList.remove('error');
    clearTimeout(tGuardar);
    tGuardar = setTimeout(guardarYa, 1200);
    if (conVista) { clearTimeout(tVista); tVista = setTimeout(renderVista, 350); if (ed.tab === 'redes') { rsOpciones(); rsPedir(900); } }
  }
  async function guardarYa() {
    if (!ed || !ed.pendiente || ed.guardando) return;
    ed.guardando = true; ed.pendiente = false;
    const g = document.getElementById('guardado');
    if (g) g.textContent = 'Guardando…';
    anotarHabituales();
    const d = await Cuenta.api('/cartas/' + ed.id, { titulo: ed.titulo, carta: ed.carta, estilo: ed.estilo, formato: ed.formato, logo: ed.logo, cabecera: ed.cabecera }, 'PUT');
    ed.guardando = false;
    const g2 = document.getElementById('guardado');
    if (d.ok) { if (g2) g2.textContent = 'Guardado ✓'; }
    else {
      ed.pendiente = true;
      if (g2) { g2.textContent = d.error || 'No se ha podido guardar'; g2.classList.add('error'); }
      if (d.status === 402) { await Cuenta.cargar(); }
    }
    if (ed.pendiente && d.ok) guardarYa();
  }
  window.addEventListener('beforeunload', e => { if (ed && (ed.pendiente || ed.guardando)) { guardarYa(); e.preventDefault(); e.returnValue = ''; } });

  // ── Vista previa (mismo motor que el PDF) ──
  const vista = { iframe: null, lista: false, pendiente: false, id: 0, ancho: 794, alto: 1123 };
  function prepararVista() {
    vista.iframe = null; vista.lista = false;
    const f = document.createElement('iframe');
    f.title = 'Vista previa de tu carta';
    f.src = '/carta/vista.html';
    f.setAttribute('scrolling', 'no');
    f.tabIndex = -1;
    document.getElementById('vistaEscala').appendChild(f);
    vista.iframe = f;
    ajustarVista();
  }
  function logoActivo() { return ed.logo && ed.cabecera === 'logo' ? ed.logo : null; }
  function renderVista() {
    if (!ed || !vista.iframe) return;
    const m = document.getElementById('vistaMarco');
    if (m) m.classList.add('cargando');
    vista.pendiente = true;
    if (vista.lista) enviarVista();
  }
  function enviarVista() {
    vista.pendiente = false; vista.id++;
    vista.iframe.contentWindow.postMessage({ tipo: 'componer', id: vista.id, carta: ed.carta, estilo: ed.estilo, formato: ed.formato, logo: logoActivo(), credito: !Cuenta.esPro() }, location.origin);
  }
  function ajustarVista() {
    if (!vista.iframe) return;
    const marco = document.getElementById('vistaMarco');
    if (!marco || !marco.clientWidth) return;
    const disp = marco.clientWidth - 36;
    // La hoja estrecha se enseña a la misma escala que un A4: así se ve estrecha, no ampliada
    const e = Math.min(1, disp / Math.max(vista.ancho, 794));
    vista.iframe.style.width = vista.ancho + 'px';
    vista.iframe.style.height = vista.alto + 'px';
    vista.iframe.style.transform = 'scale(' + e + ')';
    const escala = document.getElementById('vistaEscala');
    escala.style.width = Math.floor(vista.ancho * e) + 'px';
    escala.style.height = Math.ceil(vista.alto * e) + 'px';
  }
  window.addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || !vista.iframe || e.source !== vista.iframe.contentWindow) return;
    if (e.data.tipo === 'vista-lista') { vista.lista = true; if (vista.pendiente) enviarVista(); }
    else if (e.data.tipo === 'compuesta' && e.data.id === vista.id) {
      const m = document.getElementById('vistaMarco'); if (m) m.classList.remove('cargando');
      if (e.data.error || !e.data.info) return;
      vista.ancho = Math.ceil(e.data.ancho) || 794; vista.alto = Math.ceil(e.data.alto) || 1123;
      ajustarVista();
      const i = e.data.info;
      const vi = document.getElementById('vistaInfo');
      const que = i.formato === 'elastico' ? `Cuadernillo · ${i.paginas} páginas · ${i.hojas} ${i.hojas > 1 ? 'hojas' : 'hoja'} A3` : `${i.formato === 'slim' ? 'A4 slim' : i.formato === 'a5x2' ? 'A5, dos por folio' : 'A4'} · ${i.paginas} ${i.paginas > 1 ? 'páginas' : 'página'}`;
      if (vi) vi.textContent = `${que} · ${i.platos} platos · ${NOMBRE_ESTILO[ed.estilo] || ed.estilo}`;
      ed.info = i; pintarFormato(); pintarColor();
    }
  });
  window.addEventListener('resize', ajustarVista);

  // ── Descargar, frase y traducción ──
  // Pide el PDF de lo que hay en pantalla. Devuelve null si ha saltado la pantalla de planes.
  async function pedirPDF() {
    if (ed.pendiente) await guardarYa();
    const r = await fetch('/pdf', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ carta: ed.carta, estilo: ed.estilo, formato: ed.formato, logo: logoActivo() }) });
    if (!r.ok) {
      let d = {}; try { d = await r.json(); } catch (e) {}
      if (r.status === 402) { Cuenta.planes({ motivo: d.error, vuelta: 'panel' }); return null; }
      throw new Error(d.error || 'No hemos podido generar el PDF.');
    }
    const n = (r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
    return { blob: await r.blob(), nombre: n ? n[1] : 'carta.pdf' };
  }
  async function descargar() {
    const bs = [...document.querySelectorAll('.js-descargar')];
    bs.forEach(b => { b.disabled = true; b.textContent = 'Preparando tu PDF…'; });
    try {
      const pdf = await pedirPDF();
      if (!pdf) return;
      const url = URL.createObjectURL(pdf.blob);
      const a = document.createElement('a'); a.href = url; a.download = pdf.nombre;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      Cuenta.aviso('PDF descargado.');
    } catch (e) { Cuenta.aviso(e.message); }
    finally { bs.forEach(b => { b.disabled = false; b.textContent = 'Descargar PDF'; }); }
  }

  // ── Imágenes para redes sociales ──
  function prepararRedes() {
    ed.rs = ed.rs || { tipo: 'todo', seccion: 0, plato: 0, formato: ed.carta.menu ? 'rs-vertical' : 'rs-cuadrada', textoTocado: false, n: 0 };
    const rs = ed.rs, $ = id => document.getElementById(id);
    const marca = (cont, v) => cont.querySelectorAll('button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    const pinta = () => { marca($('rsTipo'), rs.tipo); marca($('rsFormato'), rs.formato); $('rsElige').hidden = rs.tipo === 'todo'; $('rsPlatoG').hidden = rs.tipo !== 'plato'; $('rsRotuloG').hidden = rs.tipo !== 'plato'; };
    $('rsTipo').querySelectorAll('button').forEach(b => b.onclick = () => { rs.tipo = b.dataset.v; rs.textoTocado = false; pinta(); rsOpciones(); rsPedir(0); });
    $('rsFormato').querySelectorAll('button').forEach(b => b.onclick = () => { rs.formato = b.dataset.v; pinta(); rsPedir(0); });
    $('rsSeccion').onchange = e => { rs.seccion = +e.target.value; rs.plato = 0; rs.textoTocado = false; rsOpciones(); rsPedir(0); };
    $('rsPlato').onchange = e => { rs.plato = +e.target.value; rs.textoTocado = false; rsPedir(0); };
    $('rsRotulo').oninput = () => { rs.textoTocado = false; rsPedir(700); };
    app.querySelectorAll('[data-rot]').forEach(b => b.onclick = () => { $('rsRotulo').value = b.dataset.rot; rs.textoTocado = false; rsPedir(0); });
    $('rsTexto').oninput = () => { rs.textoTocado = true; };
    $('rsRehacerTexto').onclick = () => { rs.textoTocado = false; rsTexto(); };
    $('rsCopiar').onclick = async () => { const t = $('rsTexto'); try { await navigator.clipboard.writeText(t.value); } catch (e) { t.select(); document.execCommand('copy'); } Cuenta.aviso('Texto copiado.'); };
    pinta();
  }
  // Secciones y platos con nombre: lo que de verdad saldrá en la imagen
  const rsSecciones = () => ed.carta.secciones.map((s, i) => ({ i, nombre: s.nombre, platos: (s.platos || []).map((p, j) => ({ j, ...p })).filter(p => String(p.nombre || '').trim()) })).filter(s => s.platos.length);
  function rsOpciones() {
    const rs = ed.rs, S = rsSecciones(), selS = document.getElementById('rsSeccion'), selP = document.getElementById('rsPlato');
    if (!selS) return;
    if (!S.some(s => s.i === rs.seccion)) { rs.seccion = S[0] ? S[0].i : 0; rs.plato = 0; }
    selS.innerHTML = S.map(s => `<option value="${s.i}"${s.i === rs.seccion ? ' selected' : ''}>${esc(s.nombre || 'Sin nombre')}</option>`).join('');
    const sec = S.find(s => s.i === rs.seccion);
    if (sec && !sec.platos.some(p => p.j === rs.plato)) rs.plato = sec.platos[0].j;
    selP.innerHTML = sec ? sec.platos.map(p => `<option value="${p.j}"${p.j === rs.plato ? ' selected' : ''}>${esc(p.nombre)}</option>`).join('') : '';
  }
  // El texto de la publicación sale de la carta: no se inventa nada
  function rsTexto() {
    const rs = ed.rs, c = ed.carta, m = c.menu, caja = document.getElementById('rsTexto');
    if (!caja || rs.textoTocado) return;
    const eur = p => { const s = String(p || '').trim(); return !s ? '' : /^\+?\d+([.,]\d+)?$/.test(s) ? s.replace('.', ',') + ' €' : s; };
    const S = rsSecciones(), linea = p => '· ' + p.nombre.trim() + (p.precio ? (m ? ' (' + eur(p.precio) + ')' : ' — ' + eur(p.precio)) : '');
    const firma = c.nombre_restaurante ? '\n\n' + c.nombre_restaurante : '';
    let t = '';
    if (rs.tipo === 'plato') {
      const sec = S.find(s => s.i === rs.seccion), p = sec && sec.platos.find(x => x.j === rs.plato);
      if (p) t = `${document.getElementById('rsRotulo').value.trim() || 'Hoy recomendamos'}: ${p.nombre.trim()}.${p.descripcion ? ' ' + p.descripcion.trim() + '.' : ''}${p.precio && !/^\+/.test(p.precio) ? '\n' + eur(p.precio) : ''}${firma}`;
    } else {
      const lista = rs.tipo === 'seccion' ? S.filter(s => s.i === rs.seccion) : S;
      const cab = m && rs.tipo === 'todo' ? `${m.titulo || 'Menú del día'}${m.fecha ? ' · ' + m.fecha : ''}\n\n` : '';
      const pie = m && rs.tipo === 'todo' && (m.precio || m.incluye) ? `\n\n${[eur(m.precio), m.incluye].filter(Boolean).join(' · ')}` : '';
      t = cab + lista.map(s => (s.nombre ? s.nombre.trim().toLocaleUpperCase('es') + '\n' : '') + s.platos.map(linea).join('\n')).join('\n\n') + pie + firma;
    }
    caja.value = t;
  }
  let tRs = null;
  function rsPedir(espera) { clearTimeout(tRs); tRs = setTimeout(rsGenerar, espera); }
  async function rsGenerar() {
    if (!ed || ed.tab !== 'redes') return;
    const rs = ed.rs, res = document.getElementById('rsRes');
    if (!res) return;
    rsTexto();
    if (!rsSecciones().length) { res.innerHTML = '<p class="ayuda">Añade algún plato y aquí verás la imagen.</p>'; return; }
    const n = ++rs.n;
    res.classList.add('cargando');
    if (!res.children.length) res.innerHTML = '<p class="ayuda">Preparando la imagen…</p>';
    let d;
    try {
      const r = await fetch('/imagen-redes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
        body: JSON.stringify({ carta: ed.carta, estilo: ed.estilo, logo: logoActivo(), formato: rs.formato, tipo: rs.tipo, seccion: rs.seccion, plato: rs.plato, rotulo: document.getElementById('rsRotulo').value }) });
      d = await r.json();
      if (r.status === 402) { res.classList.remove('cargando'); res.innerHTML = ''; return Cuenta.planes({ motivo: d.error, vuelta: 'panel' }); }
    } catch (e) { d = { ok: false }; }
    if (n !== rs.n || !document.getElementById('rsRes')) return; // ha llegado tarde: ya se pidió otra
    res.classList.remove('cargando');
    if (!d.ok) { res.innerHTML = `<p class="ayuda">${esc(d.error || 'No hemos podido generar la imagen. Inténtalo de nuevo.')}</p>`; return; }
    const que = rs.tipo === 'plato' ? 'plato' : rs.tipo === 'seccion' ? 'seccion' : ed.carta.menu ? 'menu-del-dia' : 'carta';
    const nombre = i => `${que}-${d.nombre || 'restaurante'}-${rs.formato.slice(3)}${d.imagenes.length > 1 ? '-' + (i + 1) : ''}.png`;
    const comparte = !!(navigator.canShare && window.File);
    res.innerHTML = (d.imagenes.length > 1 ? `<div class="formato-nota"><b>Sale en ${d.imagenes.length} imágenes</b>En una sola la letra quedaría demasiado pequeña para leerla en el móvil. Publícalas juntas, como carrusel${rs.formato !== 'rs-historia' ? ', o prueba el formato Historia, que es más alto' : ''}.${d.total > d.imagenes.length ? ' Solo se enseñan las 10 primeras.' : ''}</div>` : '')
      + `<div class="rs-imgs ${rs.formato}">${d.imagenes.map((src, i) => `<figure><img src="${src}" alt="Imagen ${i + 1} para redes">
        <figcaption><a class="btn peq oscuro" href="${src}" download="${esc(nombre(i))}">Descargar</a>${comparte ? `<button class="btn peq" type="button" data-comp="${i}">Compartir</button>` : ''}</figcaption></figure>`).join('')}</div>`
      + (d.imagenes.length > 1 ? '<button class="btn peq" type="button" id="rsTodas" style="margin-top:12px">Descargar todas</button>' : '')
      + '<p class="ayuda" style="margin-top:10px">1080 píxeles de ancho, el tamaño que piden Instagram y Facebook.</p>';
    res.querySelectorAll('a[download]').forEach(a => a.addEventListener('click', () => medir('redes_descarga', { tipo: rs.tipo, formato: rs.formato })));
    const todas = document.getElementById('rsTodas');
    if (todas) todas.onclick = () => res.querySelectorAll('a[download]').forEach((a, i) => setTimeout(() => a.click(), i * 350));
    res.querySelectorAll('[data-comp]').forEach(b => b.onclick = async () => {
      try {
        const i = +b.dataset.comp, blob = await (await fetch(d.imagenes[i])).blob();
        const f = new File([blob], nombre(i), { type: 'image/png' });
        if (!navigator.canShare({ files: [f] })) throw new Error('no');
        await navigator.share({ files: [f], text: document.getElementById('rsTexto').value });
        medir('redes_compartir', { tipo: rs.tipo, formato: rs.formato });
      } catch (e) { if (e && e.name !== 'AbortError') Cuenta.aviso('Este navegador no deja compartir desde aquí. Descarga la imagen.'); }
    });
  }

  // Imprimir sin pasar por la carpeta de descargas: el PDF se carga oculto y se abre el cuadro de imprimir del navegador.
  // Los formatos que no son un A4 normal necesitan ajustes que solo puede poner quien imprime: se avisa antes.
  const AVISO_IMPRIMIR = {
    slim: 'Elige <strong>«tamaño real»</strong> (o 100 %), no «ajustar a la página». Sale en un folio y cortas el sobrante.',
    elastico: 'Papel <strong>A3</strong>, a <strong>doble cara</strong> y volteando por el <strong>borde corto</strong>, a tamaño real. Haz antes una copia de prueba y dóblala.',
    a5x2: 'Elige <strong>«tamaño real»</strong> (o 100 %) y orientación <strong>horizontal</strong>. Después cortas por la marca del centro.'
  };
  async function imprimir(avisado) {
    // Aviso en una ventana en el centro de la pantalla: no hay que buscarlo ni hacer scroll
    if (AVISO_IMPRIMIR[ed.formato] && !avisado) {
      document.querySelectorAll('.imp-velo').forEach(x => x.remove());
      const v = document.createElement('div');
      v.className = 'imp-velo';
      v.innerHTML = `<div class="imp-caja" role="dialog" aria-modal="true" aria-labelledby="impTit">
        <div class="imp-sobre">Antes de imprimir</div>
        <h2 id="impTit">${ed.formato === 'elastico' ? 'Pon estos ajustes en la impresora' : 'Pon este ajuste en la impresora'}</h2>
        <p>${AVISO_IMPRIMIR[ed.formato]}</p>
        <div class="imp-bot"><button class="btn" type="button" data-a="no">Cancelar</button><button class="btn primario" type="button" data-a="si">Entendido, imprimir</button></div></div>`;
      const cerrar = () => { v.remove(); document.removeEventListener('keydown', tecla); };
      const tecla = e => { if (e.key === 'Escape') cerrar(); };
      v.addEventListener('click', e => { if (e.target === v || e.target.dataset.a === 'no') cerrar(); else if (e.target.dataset.a === 'si') { cerrar(); imprimir(true); } });
      document.addEventListener('keydown', tecla);
      document.body.appendChild(v);
      v.querySelector('[data-a=si]').focus();
      return;
    }
    const bs = [...document.querySelectorAll('.js-imprimir')];
    bs.forEach(b => { b.disabled = true; b.textContent = 'Preparando…'; });
    try {
      const pdf = await pedirPDF();
      if (!pdf) return;
      const url = URL.createObjectURL(new Blob([pdf.blob], { type: 'application/pdf' }));
      document.querySelectorAll('iframe.marco-imprimir').forEach(f => f.remove());
      const f = document.createElement('iframe');
      f.className = 'marco-imprimir'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
      f.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none';
      let hecho = false;
      // Si el navegador no deja imprimir desde aquí, el PDF se abre en otra pestaña para imprimirlo desde ahí
      const plan_b = () => { if (hecho) return; hecho = true; const w = window.open(url, '_blank'); if (!w) Cuenta.aviso('Tu navegador no deja imprimir desde aquí. Descarga el PDF e imprímelo.'); };
      f.onload = () => { setTimeout(() => { if (hecho) return; try { f.contentWindow.focus(); f.contentWindow.print(); hecho = true; } catch (e) { plan_b(); } }, 350); };
      f.src = url;
      document.body.appendChild(f);
      setTimeout(plan_b, 6000);
      setTimeout(() => URL.revokeObjectURL(url), 10 * 60000);
      medir('imprimir', { formato: ed.formato, menu: ed.carta.menu ? 'si' : 'no' });
    } catch (e) { Cuenta.aviso(e.message); }
    finally { bs.forEach(b => { b.disabled = false; b.textContent = 'Imprimir'; }); }
  }



  // ── Formato de la hoja ──
  // ── Carta bilingüe ──
  // Lo que queda por traducir: secciones y platos con nombre que aún no tienen segundo idioma
  const biFaltan = () => ed.carta.secciones.reduce((n, s) => n + (s.nombre && s.nombre2 === undefined ? 1 : 0) + (s.platos || []).filter(p => String(p.nombre || '').trim() && p.nombre2 === undefined).length, 0);
  function pintarBilingue() {
    const caja = document.getElementById('biCaja');
    if (!caja) return;
    const c = ed.carta, cod = c.idioma2;
    if ((c.idioma || 'es').slice(0, 2) !== 'es') { caja.innerHTML = '<p class="ayuda">Esta carta ya está traducida. La versión en dos idiomas se hace desde la carta en español.</p>'; return; }
    if (!cod) {
      caja.innerHTML = `<div class="bi-fila"><select class="campo" id="biIdioma" aria-label="Segundo idioma">${Object.entries(IDIOMAS).map(([k, n]) => `<option value="${k}">${n.charAt(0).toUpperCase() + n.slice(1)}</option>`).join('')}</select><button class="btn oscuro" type="button" id="biPoner">Añadir segundo idioma</button></div>
        <p class="ayuda">Se traducen las secciones, los platos y las descripciones. Podrás corregir cada línea a mano. Si no dominas el idioma, pide a alguien que lo revise antes de imprimir.</p>`;
      document.getElementById('biPoner').onclick = e => biTraducir(document.getElementById('biIdioma').value, false, e.currentTarget);
      return;
    }
    const faltan = biFaltan();
    caja.innerHTML = `<div class="formato-nota"><b>Segundo idioma: ${IDIOMAS[cod]}</b>Cada línea se corrige en la pestaña «${c.menu ? 'Menú de hoy' : 'Platos y precios'}», debajo de su plato. Si dejas una en blanco, ese plato sale solo en español.${faltan ? `<br><strong>${faltan === 1 ? 'Hay 1 texto' : 'Hay ' + faltan + ' textos'} sin traducir.</strong>` : ''}</div>
      <div class="fila-botones" style="margin-top:12px">${faltan ? '<button class="btn oscuro peq" type="button" id="biFaltan">Traducir lo que falta</button>' : ''}<button class="btn peq" type="button" id="biTodo">Volver a traducir todo</button><button class="btn peq" type="button" id="biQuitar">Quitar el segundo idioma</button></div>`;
    const f = document.getElementById('biFaltan'); if (f) f.onclick = e => biTraducir(cod, true, e.currentTarget);
    document.getElementById('biTodo').onclick = e => { const b = e.currentTarget; if (b.dataset.ok !== '1') { b.dataset.ok = '1'; b.textContent = 'Se pierden tus correcciones. ¿Seguro?'; return; } biTraducir(cod, false, b); };
    document.getElementById('biQuitar').onclick = e => { const b = e.currentTarget; if (b.dataset.ok !== '1') { b.dataset.ok = '1'; b.textContent = '¿Quitar y borrar las traducciones?'; return; }
      delete c.idioma2; c.secciones.forEach(s => { delete s.nombre2; (s.platos || []).forEach(p => { delete p.nombre2; delete p.descripcion2; }); }); cambio(); pintarEditor(); };
  }
  async function biTraducir(cod, soloFaltan, boton) {
    const c = ed.carta, destinos = [], textos = [];
    const pon = (obj, campo, origen) => { destinos.push([obj, campo]); textos.push(String(origen || '').trim()); };
    c.secciones.forEach(s => {
      if (s.nombre && !(soloFaltan && s.nombre2 !== undefined)) pon(s, 'nombre2', s.nombre);
      (s.platos || []).forEach(p => { if (String(p.nombre || '').trim() && !(soloFaltan && p.nombre2 !== undefined)) { pon(p, 'nombre2', p.nombre); pon(p, 'descripcion2', p.descripcion); } });
    });
    if (!textos.length) return;
    const txt = boton.textContent; boton.disabled = true; boton.textContent = 'Traduciendo…';
    try {
      const d = await Cuenta.api('/segundo-idioma', { idioma: cod, textos });
      if (d.status === 402) return Cuenta.planes({ motivo: d.error, vuelta: 'panel' });
      if (!d.ok) throw new Error(d.error || 'No se ha podido traducir.');
      const igual = (a, b) => String(a).trim().toLocaleLowerCase() === String(b).trim().toLocaleLowerCase();
      // Si la traducción es idéntica al original (un «salmorejo»), no se repite la línea
      destinos.forEach(([obj, campo], i) => { obj[campo] = igual(d.traducciones[i], textos[i]) ? '' : d.traducciones[i]; });
      c.idioma2 = cod;
      cambio(); pintarEditor();
      Cuenta.aviso('Segundo idioma añadido. Revísalo antes de imprimir.');
    } catch (e) { Cuenta.aviso(e.message); if (boton.isConnected) { boton.disabled = false; boton.textContent = txt; } }
  }
  // Tras un cambio con una frase, cada plato que conserva su nombre conserva también su traducción
  function heredarSegunda(vieja, nueva) {
    if (!vieja.idioma2) return;
    nueva.idioma2 = vieja.idioma2;
    const k = x => String(x || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '');
    const sec = new Map(), pl = new Map();
    (vieja.secciones || []).forEach(s => { if (s.nombre2 !== undefined) sec.set(k(s.nombre), s.nombre2); (s.platos || []).forEach(p => { if (p.nombre2 !== undefined) pl.set(k(p.nombre) + '|' + k(p.descripcion), p); }); });
    (nueva.secciones || []).forEach(s => { if (sec.has(k(s.nombre))) s.nombre2 = sec.get(k(s.nombre)); (s.platos || []).forEach(p => { const v = pl.get(k(p.nombre) + '|' + k(p.descripcion)); if (v) { p.nombre2 = v.nombre2; if (v.descripcion2) p.descripcion2 = v.descripcion2; } }); });
  }

  // ── Color propio ──
  function pintarColor() {
    if (!ed) return;
    const c = String(ed.carta.color || '').toLowerCase();
    let alguno = false;
    document.querySelectorAll('#colores button').forEach(b => { const on = (b.dataset.c || '').toLowerCase() === c; alguno = alguno || on; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    const otro = document.querySelector('#colores .otro'), m = document.getElementById('colorOtroM');
    if (otro) { otro.classList.toggle('on', !!c && !alguno); m.style.background = c && !alguno ? c : 'conic-gradient(#e33,#eb3,#3b6,#36c,#93c,#e33)'; }
    const nota = document.getElementById('colorNota'), i = ed.info || {};
    if (nota) nota.textContent = !c ? '' : i.sinColor ? `El estilo ${NOMBRE_ESTILO[ed.estilo] || ed.estilo} no cambia de color. Elige otro estilo para usar el tuyo.`
      : i.colorOscurecido ? 'Lo hemos oscurecido un poco para que se lea bien sobre papel blanco.' : '';
  }

  function pintarFormato() {
    if (!ed) return;
    document.querySelectorAll('.formato-b').forEach(b => { const on = b.dataset.f === ed.formato; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    const nota = document.getElementById('formatoNota'), pie = document.getElementById('notaVista');
    const i = ed.info && ed.info.formato === ed.formato ? ed.info : null;
    if (nota) nota.innerHTML = ed.formato === 'elastico' ? `<div class="formato-nota"><b>Cómo se imprime el cuadernillo</b>
      El PDF sale ya montado en A3 apaisado${i ? `: ${i.hojas} ${i.hojas > 1 ? 'hojas' : 'hoja'}, ${i.paginas} páginas` : ''}, con las páginas en el orden correcto para que al doblar queden seguidas.
      <ol><li>Imprime en A3 a doble cara, volteando por el <b style="display:inline">borde corto</b>.</li><li>Hiende y dobla cada hoja por el centro.</li><li>Mete unas dentro de otras, en orden, y pasa el elástico.</li></ol></div>`
      : ed.formato === 'a5x2' ? `<div class="formato-nota"><b>Cómo se imprime</b>El PDF es un folio apaisado con el menú dos veces. Imprime «a tamaño real» y corta por la marca del centro: salen dos hojas A5.</div>`
      : ed.formato === 'slim' ? `<div class="formato-nota"><b>Cómo se imprime el A4 slim</b>El PDF mide 14 × 29,7 cm. En imprenta, pídelo a ese tamaño. En una impresora de casa, imprime «a tamaño real» en un folio y corta el sobrante.</div>` : '';
    if (pie) pie.textContent = ed.formato === 'a5x2' ? 'Aquí ves una hoja. En el PDF sale dos veces en un folio apaisado, para cortar.' : ed.formato === 'elastico' ? 'Aquí la ves página a página. El PDF sale montado en A3 para imprimir y doblar.'
      : ed.formato === 'slim' ? 'A4 slim, 14 × 29,7 cm. Antes de imprimir, revisa precios y alérgenos.' : 'A4 listo para imprimir. Antes de imprimir, revisa precios y alérgenos.';
  }

  // ── Alérgenos ──
  const AL = Alergenos;
  function pintarAlergenos() {
    const caja = document.getElementById('alLista');
    if (!caja) return;
    caja.innerHTML = ed.carta.secciones.map((s, si) => `<div class="al-sec">${esc(s.nombre || 'Sin nombre')}</div>` + s.platos.map((p, pi) => {
      const al = AL.limpiar(p.al);
      return `<div class="al-plato" data-s="${si}" data-p="${pi}">
        <div class="al-plato-cab"><b>${esc(p.nombre || 'Plato sin nombre')}${p.alergenos ? `<small>En tu carta ponía: ${esc(p.alergenos)}</small>` : ''}</b>
          ${al.length ? '' : `<button type="button" class="al-ok${p.al_ok ? ' on' : ''}" aria-pressed="${!!p.al_ok}">${p.al_ok ? '✓ Sin alérgenos' : 'Marcar «sin alérgenos»'}</button>`}</div>
        <div class="al-celdas">${AL.ALERGENOS.map(a => `<button type="button" class="al-c${al.includes(a.id) ? ' on' : ''}" data-id="${a.id}" title="${esc(a.es)}" aria-label="${esc(a.es)}" aria-pressed="${al.includes(a.id)}">${AL.icono(a.id)}</button>`).join('')}</div>
        <div class="al-nombres">${al.length ? esc(al.map(id => AL.nombre(id, 'es')).join(' · ')) : ''}</div></div>`;
    }).join('')).join('');
    contarAlergenos();
  }
  function contarAlergenos() {
    const el = document.getElementById('alCuenta');
    if (!el) return;
    const todos = ed.carta.secciones.flatMap(s => s.platos);
    const pend = todos.filter(p => !AL.limpiar(p.al).length && !p.al_ok).length;
    el.innerHTML = pend ? `<b>${todos.length - pend} de ${todos.length}</b> platos revisados · quedan ${pend} sin revisar` : `<b>Los ${todos.length} platos están revisados.</b>`;
  }
  document.addEventListener('click', e => {
    if (!ed) return;
    const fila = e.target.closest && e.target.closest('.al-plato');
    if (!fila) return;
    const p = ed.carta.secciones[+fila.dataset.s].platos[+fila.dataset.p];
    const c = e.target.closest('.al-c'), ok = e.target.closest('.al-ok');
    if (c) {
      const id = +c.dataset.id, al = new Set(AL.limpiar(p.al));
      if (al.has(id)) al.delete(id); else al.add(id);
      p.al = [...al].sort((a, b) => a - b);
      if (p.al.length) delete p.al_ok; else delete p.al;
    } else if (ok) {
      if (p.al_ok) delete p.al_ok; else p.al_ok = true;
    } else return;
    pintarAlergenos(); cambio();
  });
  async function descargarTabla() {
    const b = document.getElementById('tablaAl');
    b.disabled = true; b.textContent = 'Preparando la tabla…';
    try {
      if (ed.pendiente) await guardarYa();
      const r = await fetch('/tabla-alergenos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ carta: ed.carta, logo: logoActivo() }) });
      if (!r.ok) {
        let d = {}; try { d = await r.json(); } catch (e) {}
        if (r.status === 402) return Cuenta.planes({ motivo: d.error, vuelta: 'panel' });
        throw new Error(d.error || 'No hemos podido generar la tabla.');
      }
      const blob = await r.blob();
      const n = (r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = n ? n[1] : 'alergenos.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      medir('tabla_alergenos');
      Cuenta.aviso('Tabla descargada.');
    } catch (e) { Cuenta.aviso(e.message); }
    finally { const b2 = document.getElementById('tablaAl'); if (b2) { b2.disabled = false; b2.textContent = 'Descargar tabla de alérgenos (PDF)'; } }
  }
  // Tras un cambio hecho por la máquina (frase o traducción) los alérgenos marcados se conservan solo cuando
  // no hay duda de a qué plato pertenecen. Devuelve cuántos platos los han perdido, para avisar.
  function heredarAlergenos(vieja, nueva, porPosicion) {
    const tenia = p => AL.limpiar(p.al).length || p.al_ok;
    const copiar = (de, a) => { if (AL.limpiar(de.al).length) a.al = AL.limpiar(de.al); else if (de.al_ok) a.al_ok = true; };
    if (vieja.alergenos_modo) nueva.alergenos_modo = vieja.alergenos_modo;
    const vs = vieja.secciones || [], ns = nueva.secciones || [];
    if (porPosicion) {
      const igual = vs.length === ns.length && vs.every((s, i) => s.platos.length === ns[i].platos.length);
      if (igual) { vs.forEach((s, i) => s.platos.forEach((p, j) => copiar(p, ns[i].platos[j]))); return 0; }
    }
    const clave = p => String(p.nombre || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '');
    const cuenta = (lista, k) => lista.filter(p => clave(p) === k).length;
    const viejos = vs.flatMap(s => s.platos), nuevos = ns.flatMap(s => s.platos);
    let perdidos = 0;
    viejos.filter(tenia).forEach(p => {
      const k = clave(p);
      const dest = k && cuenta(viejos, k) === 1 && cuenta(nuevos, k) === 1 ? nuevos.find(x => clave(x) === k) : null;
      if (dest) copiar(p, dest); else perdidos++;
    });
    return perdidos;
  }

  async function pedirAjuste(ajuste) {
    // A la máquina no se le mandan los alérgenos: ni los necesita ni debe tocarlos
    const { menu, ...sinMenu } = ed.carta;
    const sinAl = { ...sinMenu, secciones: ed.carta.secciones.map(({ nombre2, ...s }) => ({ ...s, platos: s.platos.map(({ al, al_ok, nombre2, descripcion2, ...p }) => p) })) };
    delete sinAl.idioma2; delete sinAl.color;
    delete sinAl.alergenos_modo;
    const r = await Cuenta.api('/rehacer', { carta: sinAl, ajuste });
    if (!r.ok) throw new Error(r.error || 'No ha sido posible aplicar el cambio.');
    const vuelta = menu ? { ...r.carta, menu } : r.carta;
    if (ed.carta.color) vuelta.color = ed.carta.color;
    return vuelta;
  }
  async function aplicarFrase() {
    const t = document.getElementById('fFrase');
    const ajuste = t.value.trim();
    if (!ajuste) { t.focus(); return; }
    const b = document.getElementById('aplicarFrase');
    b.disabled = true; b.textContent = 'Aplicando…';
    try {
      const nueva = await pedirAjuste(ajuste);
      const perdidos = heredarAlergenos(ed.carta, nueva, false);
      heredarSegunda(ed.carta, nueva);
      ed.carta = { ...ed.carta, ...nueva, nombre_restaurante: nueva.nombre_restaurante || ed.carta.nombre_restaurante };
      t.value = '';
      cambio(); pintarEditor();
      Cuenta.aviso(perdidos ? `Cambio aplicado. ${perdidos === 1 ? 'Un plato ha' : perdidos + ' platos han'} cambiado de nombre: vuelve a marcar sus alérgenos.` : 'Cambio aplicado. Revisa la carta.');
    } catch (e) { Cuenta.aviso(e.message); }
    finally { const b2 = document.getElementById('aplicarFrase'); if (b2) { b2.disabled = false; b2.textContent = 'Aplicar'; } }
  }
  async function traducir(cod, b) {
    const todos = [...document.querySelectorAll('[data-idioma]')];
    todos.forEach(x => x.disabled = true); b.textContent = 'Traduciendo…';
    try {
      const nueva = await pedirAjuste(`Traduce TODA la carta al ${IDIOMAS[cod]} (código ${cod}) con terminología profesional de hostelería: secciones, platos, descripciones, subtítulo, servicios y nota al pie. No traduzcas el nombre del restaurante ni los precios. Pon "idioma" a "${cod}".`);
      nueva.idioma = cod;
      const perdidos = heredarAlergenos(ed.carta, nueva, true);
      const d = await Cuenta.api('/cartas', { titulo: `${ed.titulo} (${IDIOMAS[cod]})`, carta: nueva, estilo: ed.estilo, formato: ed.formato, logo: ed.logo, cabecera: ed.cabecera });
      if (!d.ok) throw new Error(d.error || 'No se ha podido guardar la copia.');
      Cuenta.aviso(perdidos ? 'Copia traducida guardada. Revisa los alérgenos: la traducción ha cambiado platos de sitio.' : 'Copia traducida guardada.');
      location.hash = 'carta=' + d.id;
    } catch (e) { Cuenta.aviso(e.message); }
    finally { todos.forEach(x => { if (x.isConnected) { x.disabled = false; x.textContent = IDIOMAS[x.dataset.idioma]; } }); }
  }

  // ── Cuenta ──
  function cambiarClave() {
    const sinClave = !!(Cuenta.estado && Cuenta.estado.sinClave);
    const velo = document.createElement('div');
    velo.className = 'cu-velo';
    velo.innerHTML = `<div class="cu-caja" role="dialog" aria-modal="true"><button class="cu-cerrar" type="button" aria-label="Cerrar">×</button>
      <h2 class="cu-titulo">${sinClave ? 'Crear contraseña' : 'Cambiar contraseña'}</h2>
      ${sinClave ? '<p class="cu-sub">Entras con Google. Si quieres, crea también una contraseña para entrar con tu email.</p>' : ''}
      <form novalidate><label class="cu-campo"${sinClave ? ' hidden' : ''}><span>Contraseña actual</span><input type="password" name="actual" autocomplete="current-password"></label>
      <label class="cu-campo"><span>Nueva contraseña (mínimo 8)</span><input type="password" name="nueva" autocomplete="new-password"></label>
      <button class="cu-btn" type="submit">Guardar</button><p class="cu-error"></p></form></div>`;
    document.body.appendChild(velo);
    const cerrarV = () => velo.remove();
    velo.querySelector('.cu-cerrar').onclick = cerrarV;
    velo.addEventListener('mousedown', e => { if (e.target === velo) cerrarV(); });
    const f = velo.querySelector('form');
    (sinClave ? f.nueva : f.actual).focus();
    f.onsubmit = async ev => {
      ev.preventDefault();
      const d = await Cuenta.api('/cuenta/clave', { actual: f.actual.value, nueva: f.nueva.value });
      if (!d.ok) { velo.querySelector('.cu-error').textContent = d.error; return; }
      cerrarV(); await Cuenta.cargar(); Cuenta.aviso(sinClave ? 'Contraseña creada.' : 'Contraseña cambiada.');
    };
  }
  function borrarCuenta() {
    const sinClave = !!(Cuenta.estado && Cuenta.estado.sinClave);
    const velo = document.createElement('div');
    velo.className = 'cu-velo';
    velo.innerHTML = `<div class="cu-caja" role="dialog" aria-modal="true"><button class="cu-cerrar" type="button" aria-label="Cerrar">×</button>
      <h2 class="cu-titulo">Borrar mi cuenta</h2>
      <p class="cu-sub">Se borran tu cuenta y todas tus cartas guardadas, y se cancela tu suscripción si la tienes. No se puede deshacer.</p>
      <form novalidate><label class="cu-campo"><span>${sinClave ? 'Escribe BORRAR para confirmar' : 'Escribe tu contraseña para confirmar'}</span><input type="${sinClave ? 'text' : 'password'}" name="clave" autocomplete="${sinClave ? 'off' : 'current-password'}"></label>
      <button class="cu-btn" type="submit" style="background:#C62828">Borrar para siempre</button><p class="cu-error"></p></form></div>`;
    document.body.appendChild(velo);
    const cerrarV = () => velo.remove();
    velo.querySelector('.cu-cerrar').onclick = cerrarV;
    const f = velo.querySelector('form');
    f.clave.focus();
    f.onsubmit = async ev => {
      ev.preventDefault();
      const d = await Cuenta.api('/cuenta/borrar', sinClave ? { confirmar: f.clave.value } : { clave: f.clave.value });
      if (!d.ok) { velo.querySelector('.cu-error').textContent = d.error; return; }
      location.href = '/';
    };
  }

  // ── Inicio ──
  (async function () {
    await Cuenta.cargar();
    await Cuenta.vueltaDelPago();
    const params = new URLSearchParams(location.search);
    if (params.get('portal')) { history.replaceState(null, '', '/panel' + location.hash); await Cuenta.cargar(); }
    // Enlace del correo de «Olvidé mi contraseña»
    const tokenClave = params.get('restablecer');
    if (tokenClave) { history.replaceState(null, '', '/panel'); Cuenta.restablecer(tokenClave, { alEntrar: route }); }
    // Acceso al panel de administración: /admin manda aquí si no hay sesión de administrador
    if (params.get('admin') === '1') {
      history.replaceState(null, '', '/panel');
      if (Cuenta.estado) Cuenta.aviso('Esta cuenta no tiene acceso de administrador. Entra con el email de administración.', 7000);
      else Cuenta.acceso({ modo: 'entrar', motivo: 'Entra con tu cuenta de administración.', alEntrar: () => { location.href = '/admin'; } });
    }
  })();
</script>
