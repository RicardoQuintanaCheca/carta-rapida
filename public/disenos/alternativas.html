<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Alternativas de portada — Carta Rápida</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<style>
/* Prototipos de la primera pantalla. Misma identidad que la web (Bricolage, negro, naranja) y mismos textos; cambia la idea. */
:root{--ink:#0C0C0D;--muted:#6C6C72;--line:#E6E6EA;--soft:#F3F3F5;--accent:#FF4A1C;--f:'Bricolage Grotesque',system-ui,sans-serif;--gut:clamp(18px,4vw,56px);--out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;background:#fff;color:var(--ink);font:400 17px/1.6 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}a{color:inherit}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px;padding:0 var(--gut);max-width:1352px;margin:0 auto}
.logo{font-weight:800;font-size:19px;letter-spacing:-.03em;text-decoration:none;white-space:nowrap}.logo span{color:var(--accent)}
.nav nav{display:flex;gap:30px;font-size:15px;font-weight:500;color:var(--muted)}.nav nav a{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:14px;border:0;font:650 16px/1 var(--f);text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .18s var(--out),background-color .2s ease}
.btn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.btn:hover{transform:translateY(-2px)}}
.b-ink{background:var(--ink);color:#fff}.b-acc{background:var(--accent);color:#fff}.b-gho{box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.peq{min-height:42px;padding:0 18px;font-size:15px;border-radius:12px}
.btn svg{width:18px;height:18px}
h1{margin:0;font-weight:700;letter-spacing:-.055em;line-height:.88;text-wrap:balance}h1 em{font-style:normal;color:var(--accent)}
.golpe{margin:0;font-weight:650;letter-spacing:-.03em;line-height:1.2;font-size:clamp(19px,1.8vw,26px)}
.lead{margin:0;color:var(--muted);font-size:clamp(17px,1.4vw,20px);max-width:32em}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.trust{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--muted)}
.trust span{display:inline-flex;align-items:center;gap:8px}.trust span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hoja{aspect-ratio:210/297;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(12,12,13,.06),0 40px 80px -36px rgba(12,12,13,.4),0 0 0 1px rgba(12,12,13,.04)}
.hoja img{width:100%;height:100%;object-fit:cover;object-position:top}
.sube{opacity:0;transform:translateY(14px);animation:sube .5s var(--out) forwards}
.s1{animation-delay:.05s}.s2{animation-delay:.1s}.s3{animation-delay:.15s}.s4{animation-delay:.2s}.s5{animation-delay:.28s}
@keyframes sube{to{opacity:1;transform:none}}
.resto{border-top:1px solid var(--line);margin-top:clamp(40px,6vw,80px);padding:28px var(--gut);color:#A0A0A8;font-size:14px;text-align:center}

/* ── 1 · Escaparate: dos columnas, la carta manda y va cambiando de estilo sola ── */
.v1{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(28px,5vw,80px);align-items:center;max-width:1352px;margin:0 auto;padding:clamp(24px,4vw,56px) var(--gut) 0}
.v1 h1{font-size:clamp(50px,7.6vw,128px)}
.v1 .golpe{margin-top:clamp(20px,2.4vw,32px)}.v1 .lead{margin-top:12px}.v1 .ctas{margin-top:28px}.v1 .trust{margin-top:22px}
.v1 .pila{position:relative;justify-self:center;width:min(100%,440px)}
.v1 .pila::before,.v1 .pila::after{content:"";position:absolute;inset:0;border-radius:6px;background:#fff;box-shadow:0 0 0 1px rgba(12,12,13,.07),0 30px 60px -40px rgba(12,12,13,.35)}
.v1 .pila::before{rotate:-7deg;translate:-7% 2%}.v1 .pila::after{rotate:5deg;translate:6% 1%}
.v1 .hoja{position:relative;z-index:1}
.v1 .hoja img{position:absolute;inset:0;opacity:0;transition:opacity .28s ease-out}.v1 .hoja img.on{opacity:1}
.v1 .rotulo{position:absolute;z-index:2;left:50%;bottom:-18px;translate:-50% 0;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;white-space:nowrap}
.v1 .rotulo i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.v1 .puntos{display:flex;justify-content:center;gap:6px;margin-top:40px}
.v1 .puntos button{width:26px;height:26px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.v1 .puntos button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);transition:background-color .15s ease-out,transform .15s var(--out)}
.v1 .puntos button[aria-pressed="true"]::before{background:var(--ink);transform:scale(1.3)}

/* ── 2 · Antes y después: el visitante arrastra y ve su carta convertirse ── */
.v2{max-width:1180px;margin:0 auto;padding:clamp(20px,3vw,40px) var(--gut) 0;text-align:center}
.v2 h1{font-size:clamp(46px,8vw,120px)}
.v2 .golpe{margin-top:clamp(16px,2vw,24px)}
.v2 .comparar{position:relative;width:min(100%,430px);margin:clamp(20px,2.4vw,32px) auto 0;aspect-ratio:210/297;border-radius:14px;overflow:hidden;background:var(--soft);box-shadow:0 40px 90px -40px rgba(12,12,13,.45),0 0 0 1px rgba(12,12,13,.06);--p:46%;touch-action:pan-y}
.v2 .comparar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.v2 .comparar .antes{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.v2 .linea{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(12,12,13,.15);pointer-events:none}
.v2 .mango{position:absolute;top:50%;left:var(--p);translate:-50% -50%;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(255,74,28,.8);pointer-events:none}
.v2 .etq{position:absolute;top:12px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:6px;pointer-events:none}
.v2 .etq.a{left:12px;background:rgba(12,12,13,.82);color:#fff}.v2 .etq.d{right:12px;background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.v2 input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;touch-action:pan-y}
.v2 .comparar:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:4px}
.v2 .pista{margin:14px 0 0;font-size:14px;color:var(--muted)}
.v2 .lead{margin:22px auto 0}.v2 .ctas{justify-content:center;margin-top:24px}.v2 .trust{justify-content:center;margin-top:20px}

/* ── 3 · Muestrario: los veinte estilos pasan detrás; se vende la variedad ── */
.v3{position:relative;text-align:center;padding:clamp(28px,5vw,64px) 0 0}
.v3 .txt{position:relative;z-index:2;padding:0 var(--gut)}
.v3 h1{font-size:clamp(52px,11vw,190px)}
.v3 .golpe{margin-top:clamp(18px,2.2vw,30px)}.v3 .lead{margin:12px auto 0}.v3 .ctas{justify-content:center;margin-top:26px}.v3 .trust{justify-content:center;margin-top:20px}
.v3 .muro{margin-top:clamp(30px,4vw,56px);display:grid;gap:clamp(12px,1.6vw,22px);-webkit-mask:linear-gradient(90deg,#0000,#000 9%,#000 91%,#0000);mask:linear-gradient(90deg,#0000,#000 9%,#000 91%,#0000)}
.v3 .fila{display:flex;gap:clamp(12px,1.6vw,22px);width:max-content;animation:corre 70s linear infinite}
.v3 .fila.dos{animation-direction:reverse;animation-duration:84s}
.v3 .fila .hoja{flex:none;width:clamp(150px,17vw,250px);box-shadow:0 0 0 1px rgba(12,12,13,.07),0 24px 40px -30px rgba(12,12,13,.4)}
.v3 .muro:hover .fila{animation-play-state:paused}
@keyframes corre{to{transform:translateX(calc(-50% - clamp(6px,.8vw,11px)))}}
.v3 .cuenta{display:inline-block;margin-bottom:16px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#C93A0E}

@media (max-width:860px){
  .nav nav{display:none}
  .v1{grid-template-columns:minmax(0,1fr);text-align:center}.v1 .lead{margin-inline:auto}.v1 .ctas,.v1 .trust{justify-content:center}.v1 .pila{width:min(72%,330px);margin-top:14px}
  .ctas .btn{flex:1 1 100%}
  .v3 .muro .fila.dos{display:none}
}
@media (prefers-reduced-motion:reduce){.sube{animation:none;opacity:1;transform:none}.v3 .fila{animation:none}.v1 .hoja img{transition:none}.btn{transition:none}}

/* ── Selector (especificación fija de la skill; no forma parte del diseño) ── */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
</style></head><body>
<header class="nav"><a class="logo" href="/">Carta <span>Rápida</span></a><nav><a href="/#prueba">Pruébala</a><a href="/#estilos">Estilos</a><a href="/#pro">Carta Pro</a><a href="/#precios">Precios</a></nav><a class="btn b-ink peq" href="/#prueba">Empezar gratis</a></header>
<main id="stage"></main>
<div class="resto">Debajo iría el resto de la página tal como está ahora: cifras, herramienta, estilos, Carta Pro y precios.</div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Escaparate</button>
  <button class="proto-picker-item">Antes y después</button>
  <button class="proto-picker-item">Muestrario</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3l2-3h8l2 3h3v13H3z"/><circle cx="12" cy="13" r="4"/></svg>';
const TITULAR = 'De una foto <em>a tu carta.</em>';
const GOLPE = '<p class="golpe sube s1">Tienes un restaurante. No una agencia de diseño.</p>';
const LEAD = '<p class="lead sube s2">Haz una foto a la carta que tienes. En 30 segundos te la devolvemos maquetada, en PDF A4, lista para imprimir. Sin plantillas. Sin arrastrar cajitas. Sin teclear un solo plato.</p>';
const CTAS = '<div class="ctas sube s3"><a class="btn b-acc" href="/#prueba">' + CAM + 'Sube una foto de tu carta</a><a class="btn b-gho" href="/#estilos">Ver los estilos</a></div>';
const TRUST = '<div class="trust sube s4"><span>Gratis</span><span>Sin tarjeta</span><span>PDF A4 en 30 segundos</span></div>';
const ESTILOS = [['riviera', 'Riviera'], ['vermut', 'Vermut'], ['serigrafia', 'Serigrafía'], ['bloque', 'Bloque'], ['marinero', 'Marinero'], ['pizarra', 'Pizarra']];
const TODOS = ['riviera', 'bloque', 'gaceta', 'vermut', 'serigrafia', 'brunch', 'cartel', 'marinero', 'azulejo', 'pizarra', 'trattoria', 'ticket', 'brasserie', 'sobremesa', 'editorial', 'sumi', 'deco', 'mantel', 'barra', 'autor'];
const img = (k, alt) => '<img src="/ejemplo/portada-' + k + '-640.webp" alt="' + (alt || '') + '" loading="lazy">';

const variants = [
  // 1 · Escaparate
  () => '<section class="v1"><div><h1 class="sube">' + TITULAR + '</h1>' + GOLPE + LEAD + CTAS + TRUST + '</div>'
    + '<div class="sube s5"><div class="pila"><div class="hoja" id="v1hoja">' + ESTILOS.map(([k, n], i) => '<img' + (i ? '' : ' class="on"') + ' src="/ejemplo/portada-' + k + '-640.webp" alt="' + (i ? '' : 'Carta de Casa Pepe en estilo ' + n) + '">').join('') + '</div>'
    + '<div class="rotulo"><i></i>Estilo <span id="v1nombre">' + ESTILOS[0][1] + '</span></div></div>'
    + '<div class="puntos" role="group" aria-label="Estilo de la carta de ejemplo">' + ESTILOS.map(([k, n], i) => '<button type="button" data-i="' + i + '" aria-pressed="' + (i === 0) + '" aria-label="Ver en estilo ' + n + '"></button>').join('') + '</div></div></section>',
  // 2 · Antes y después
  () => '<section class="v2"><h1 class="sube">' + TITULAR + '</h1>' + GOLPE
    + '<div class="comparar sube s2" id="v2cmp"><img src="/ejemplo/portada-vermut.webp" alt="La misma carta maquetada en estilo Vermut"><img class="antes" src="/ejemplo/antes.webp" alt="La carta original de Casa Pepe, hecha en un procesador de textos">'
    + '<span class="etq a">Tu foto</span><span class="etq d">Tu carta</span><span class="linea"></span><span class="mango"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg></span>'
    + '<input type="range" min="4" max="96" value="46" aria-label="Comparar la carta original con la maquetada"></div>'
    + '<p class="pista sube s3">Arrastra para comparar</p>' + LEAD.replace('s2', 's3') + CTAS.replace('s3', 's4') + TRUST.replace('s4', 's5') + '</section>',
  // 3 · Muestrario
  () => '<section class="v3"><div class="txt"><div class="cuenta sube">Veinte estilos</div><h1 class="sube">' + TITULAR + '</h1>' + GOLPE + LEAD + CTAS + TRUST + '</div>'
    + '<div class="muro sube s5" aria-label="Cartas de ejemplo en los veinte estilos">'
    + '<div class="fila">' + TODOS.slice(0, 10).concat(TODOS.slice(0, 10)).map((k, i) => '<div class="hoja">' + img(k, i === 0 ? 'Carta de ejemplo maquetada' : '') + '</div>').join('') + '</div>'
    + '<div class="fila dos">' + TODOS.slice(10).concat(TODOS.slice(10)).map(k => '<div class="hoja">' + img(k) + '</div>').join('') + '</div></div></section>'
];

// Interacciones de cada variante (se activan cada vez que se monta)
let reloj = null;
function activar() {
  clearInterval(reloj);
  const hoja = document.getElementById('v1hoja');
  if (hoja) {
    const imgs = [...hoja.querySelectorAll('img')], puntos = [...document.querySelectorAll('.v1 .puntos button')];
    let i = 0, tocado = false;
    const ir = n => { i = n; imgs.forEach((im, j) => im.classList.toggle('on', j === n)); puntos.forEach((p, j) => p.setAttribute('aria-pressed', j === n)); document.getElementById('v1nombre').textContent = ESTILOS[n][1]; };
    puntos.forEach(p => p.addEventListener('click', () => { tocado = true; clearInterval(reloj); ir(+p.dataset.i); }));
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) reloj = setInterval(() => { if (!tocado && !document.hidden) ir((i + 1) % imgs.length); }, 2600);
  }
  const cmp = document.getElementById('v2cmp');
  if (cmp) { const r = cmp.querySelector('input'); r.addEventListener('input', () => cmp.style.setProperty('--p', r.value + '%')); }
}
new MutationObserver(activar).observe(document.getElementById('stage'), { childList: true });

// ── Cableado del selector (tal cual lo fija la skill) ──
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body></html>
